<figcaption>密封于气缸中的理想气体从状态a依次经ab、bc、cd三过程到达状态d（取nR=1，pV=T恒成立）。ab段标注'等压'，图中p保持水平不变（p=1，T由1增至2，V由1增至2）；bc段标注'等温'，图中p随V增大而下降（竖直线向下）（T恒为2，V由2增至4，p由1降至0.5）；cd段标注'等容'，并画出过原点的虚线以显示cd线段共线于该虚线（V恒为4，T由2增至4，p=T/4由0.5升至1，沿过原点的直线）。活塞气缸示意图中，气体区域宽度对应V、温度计液柱高度对应T，随过程同步变化。</figcaption></figure>
