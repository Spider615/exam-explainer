<figcaption>归一化换算：GM_月=1，r_p(轨道1半径/轨道2近月点距离)=1，r_a(轨道2远月点距离)=2；探测器质量取1，故动能、势能、机械能均为单位质量下的比能量。开普勒方程 π·u=E-e·sin(E) 解出偏近点角E(u)，r(u)=a(1-e·cos(E))，活力公式给出v(u)，角动量守恒给出切向速度vt=L/r，径向速度vr由v²-vt²开方得到。A→B过程中r单调增大，故引力做负功、动能与加速度均单调减小；轨道1机械能与轨道2机械能的数值对比（mechE1≈-0.5，mechE2≈-0.333），二者不相等，说明在A点变轨加速使机械能增大。</figcaption></figure>
