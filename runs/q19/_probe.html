<figcaption class="u">主图（左上）：世界坐标系 x 右 y 上，比例尺 42px/R，O为坐标原点。区域Ⅰ为圆形磁场区（与x轴切于P、y轴切于S，圆心O₁=(R,R)，B垂直纸面向外），区域Ⅱ为半圆形磁场区（直径MN，圆心O₂=(4R,R)，半径2R，B/2垂直纸面向外，与区域Ⅰ相切于Q）。粒子源位于P点下方，经电压U加速后以速度v₀沿+y射入；OF区间(O到F=(2R,0))内任意位置发射的粒子均以v₀沿+y方向射入区域Ⅰ。图中蓝色(靛蓝)轨迹为题设粒子：从P点射入区域Ⅰ，沿半径R的圆弧顺时针转90°到达Q点（此时速度转为+x方向），再射入区域Ⅱ，沿半径2R的圆弧顺时针转90°到达N点，轨迹恰好与MN相切——这是所有能经MN射入区域Ⅲ的粒子中，在区域Ⅱ内运动时间最短的临界情形，region Ⅰ、Ⅱ内总运动时间t=3πm/(2qB)。下方展开图（红色轨迹，第(3)问）：区域Ⅲ叠加与区域Ⅰ、Ⅱ方向相反的磁场B(垂直纸面向里)以及电场E=Bv₀(沿x正方向)，粒子速度可分解为沿+y的匀速漂移v_drift=v₀(与电场力抵消)和绕漂移中心作逆时针匀速圆周运动的v_circ(大小8v₀/5)；由于展开图横轴方向的漂移量远大于纵轴方向的摆动量，此处将横轴取为漂移方向(y)、纵轴取为深入区域Ⅲ方向(x-4R)以便观察，比例尺40px/R，与主图不同。图中黑色小三角为入射点(与-y轴夹角74°)，靛蓝小圆为随时间沿+y匀速右移的导向中心，青色虚线为导向中心到粒子的连线(长度即r'=8R/5)，红色圆环为动能最大时刻(u=0.5，即v_circ与v_drift同向+y的瞬间)，此时粒子速度大小v_max=13v₀/5、到y轴距离x_max=172R/25=172mv₀/(25qB)。</figcaption></figure>


<script>window.Scenes = {};</script>
<script>window.Scenes["q19"] = function (fig) {
  var svg = fig.querySelector('svg');

  var m = 1.0, q = 1.0, B = 1.0, v0 = 1.0;
  var R = m * v0 / (q * B);
  var PI = Math.PI;

  // ---------------------------------------------------------------- 物理核心
  // 与 spec.physics.reference 完全一致（区域Ⅰ、Ⅱ：顺时针；区域Ⅲ：漂移+逆时针圆周分量）
  function calcC1(u) {
    var omega1 = q * B / m;
    var omega2 = q * B / (2 * m);
    var tBoundary = PI / (2 * omega1);
    var tTotal = tBoundary + PI / (2 * omega2);
    var t = u * tTotal;
    var x, y, vx, vy;
    if (t <= tBoundary) {
      var tau = t;
      var phi1 = PI - omega1 * tau;
      x = 2 * R + R * Math.cos(phi1);
      y = R * Math.sin(phi1);
      vx = R * omega1 * Math.sin(phi1);
      vy = -R * omega1 * Math.cos(phi1);
    } else {
      var tau2 = t - tBoundary;
      var r2 = 2 * R;
      var phi2 = PI / 2 - omega2 * tau2;
      x = 2 * R + r2 * Math.cos(phi2);
      y = -R + r2 * Math.sin(phi2);
      vx = r2 * omega2 * Math.sin(phi2);
      vy = -r2 * omega2 * Math.cos(phi2);
    }
    var speed = Math.sqrt(vx * vx + vy * vy);
    return { u: u, t: t, x: x, y: y, vx: vx, vy: vy, speed: speed, m: m, q: q, B: B, v0: v0, R: R };
  }

  function calcC2(u) {
    var omega3 = q * B / m;
    var thetaTotal = 286.0 * PI / 180.0;
    var theta = u * thetaTotal;
    var t = theta / omega3;
    var a = 24.0 * v0 / 25.0;
    var b = -32.0 * v0 / 25.0;
    var vcx = a * Math.cos(theta) - b * Math.sin(theta);
    var vcy = a * Math.sin(theta) + b * Math.cos(theta);
    var vx = vcx;
    var vy = v0 + vcy;
    var speed = Math.sqrt(vx * vx + vy * vy);
    var x = 4 * R + (a * Math.sin(theta) + b * Math.cos(theta) - b) / omega3;
    var y0 = 0.0;
    var y = y0 + v0 * t + (a * (1 - Math.cos(theta)) + b * Math.sin(theta)) / omega3;
    return { u: u, t: t, x: x, y: y, vx: vx, vy: vy, speed: speed, m: m, q: q, B: B, v0: v0, R: R };
  }

  function probeCalc(u, caseId) {
    if (caseId === 'c2') return calcC2(u);
    return calcC1(u);
  }

  // ---------------------------------------------------------------- 屏幕映射
  // 主图（区域Ⅰ、Ⅱ）：常规 x 右 y 上
  var S1 = 42, OX1 = 100, OY1 = 224;
  function mx(x) { return OX1 + S1 * x; }
  function my(y) { return OY1 - S1 * y; }

  // 区域Ⅲ展开图：横轴 = 沿 MN 的漂移方向(世界 y)，纵轴 = 深入区域Ⅲ的方向(世界 x-4R)
  // 因区域Ⅲ内粒子沿 y 方向漂移量远大于 x 方向摆动量，旋转 90° 展开以适应画布。
  var S3 = 40, OX3 = 60, OY3 = 356;
  function ix(yWorld) { return OX3 + S3 * yWorld; }
  function iy(xWorld) { return OY3 + S3 * (xWorld - 4 * R); }

  function pathFromPoints(pts) {
    var d = '';
    for (var i = 0; i < pts.length; i++) {
      d += (i === 0 ? 'M ' : ' L ') + pts[i][0].toFixed(2) + ' ' + pts[i][1].toFixed(2);
    }
    return d;
  }

  // ---------------------------------------------------------------- 静态几何（构造时算一次）
  var regionIIpath = svg.querySelector('#q19-regionII-boundary');
  (function buildRegionII() {
    var pts = [];
    for (var k = 0; k <= 32; k++) {
      var betaDeg = 90 + 180 * (k / 32);
      var betaRad = betaDeg * PI / 180;
      var wx = 4 * R + 2 * R * Math.cos(betaRad);
      var wy = 1 * R + 2 * R * Math.sin(betaRad);
      pts.push([mx(wx), my(wy)]);
    }
    regionIIpath.setAttribute('d', pathFromPoints(pts) + ' Z');
  })();

  var c1FullPath = svg.querySelector('#q19-c1-fullpath');
  (function buildC1Full() {
    var pts = [];
    for (var i = 0; i <= 40; i++) {
      var s = calcC1(i / 40);
      pts.push([mx(s.x), my(s.y)]);
    }
    c1FullPath.setAttribute('d', pathFromPoints(pts));
  })();

  var c2FullPath = svg.querySelector('#q19-c2-fullpath');
  (function buildC2Full() {
    var pts = [];
    for (var i = 0; i <= 60; i++) {
      var s = calcC2(i / 60);
      pts.push([ix(s.y), iy(s.x)]);
    }
    c2FullPath.setAttribute('d', pathFromPoints(pts));
  })();

  // 区域Ⅲ入射点(u=0)：静态标注入射角与参考方向(-y 世界方向)
  var entryMark = svg.querySelector('#q19-c2-entrymark');
  var entryArrow = svg.querySelector('#q19-c2-entryarrow');
  var entryRef = svg.querySelector('#q19-c2-refline');

<script>/* ===== 动画运行时 ===== */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var live = [];

  function build(fig) {
    var id = fig.getAttribute('data-scene');
    var factory = window.Scenes[id];
    if (typeof factory !== 'function') return null;
    var api;
    try { api = factory(fig); } catch (e) { console.error('[scene ' + id + '] setup failed', e); return null; }
    if (!api || typeof api.step !== 'function') { console.error('[scene ' + id + '] bad contract'); return null; }

    var bar = document.createElement('div');
    bar.className = 'ctlbar';
    var pp = document.createElement('button');
    pp.type = 'button'; pp.className = 'btn pp';
    var rp = document.createElement('button');
    rp.type = 'button'; rp.className = 'btn'; rp.textContent = '重播';
    var tag = document.createElement('span');
    tag.className = 'livebadge'; tag.textContent = 'LIVE';
    bar.appendChild(pp); bar.appendChild(rp); bar.appendChild(tag);
    var own = fig.querySelector('.ctl');
    if (own) bar.appendChild(own);
    var cap = fig.querySelector('figcaption');
    fig.insertBefore(bar, cap);

    window.__api = window.__api || {}; window.__api[id] = api;
    var s = { id: id, api: api, t: 0, playing: !reduce, visible: true, fig: fig, pp: pp };
    function paint() {
      pp.textContent = s.playing ? '暂停' : '播放';
      pp.setAttribute('aria-pressed', s.playing ? 'true' : 'false');
      pp.setAttribute('aria-label', (s.playing ? '暂停' : '播放') + '动画');
      tag.style.opacity = s.playing ? '.9' : '.3';
    }
    pp.addEventListener('click', function () { s.playing = !s.playing; paint(); });
    rp.addEventListener('click', function () {
      s.t = 0;
      try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] reset', e); }
    });
    paint();
    try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] first frame', e); }

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { s.visible = es[0].isIntersecting; },
        { rootMargin: '120px' }).observe(fig);
    }
    return s;
  }

  function boot() {
    var figs = document.querySelectorAll('figure[data-scene]');
    for (var i = 0; i < figs.length; i++) {
      var s = build(figs[i]);
      if (s) live.push(s);
    }
    var g = document.getElementById('gswitch');
    if (g) {
      g.addEventListener('click', function () {
        var anyOn = live.some(function (s) { return s.playing; });
        live.forEach(function (s) { if (s.playing === anyOn) s.pp.click(); });
        g.textContent = anyOn ? '▶ 全部播放' : '⏸ 全部暂停';
      });
      g.textContent = reduce ? '▶ 全部播放' : '⏸ 全部暂停';
    }
    var last = 0;
    function frame(now) {
      var dt = last ? Math.min((now - last) / 1000, 1 / 30) : 0;
      last = now;
      for (var i = 0; i < live.length; i++) {
        var s = live[i];
        if (!s.playing || !s.visible) continue;
        s.t += dt;
        try { s.api.step(s.t); }
        catch (e) { console.error('[scene ' + s.id + '] step', e); s.playing = false; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

            y = -R + r2*sin(phi2)\n            vx = r2*omega2*sin(phi2)\n            vy = -r2*omega2*cos(phi2)\n        speed = sqrt(vx*vx + vy*vy)\n        return {\"u\": u, \"t\": t, \"x\": x, \"y\": y, \"vx\": vx, \"vy\": vy, \"speed\": speed,\n                \"m\": m, \"q\": q, \"B\": B, \"v0\": v0, \"R\": R}\n    else:\n        omega3 = q*B/m\n        theta_total = 286.0*pi/180.0\n        theta = u*theta_total\n        t = theta/omega3\n        a = 24.0*v0/25.0\n        b = -32.0*v0/25.0\n        vcx = a*cos(theta) - b*sin(theta)\n        vcy = a*sin(theta) + b*cos(theta)\n        vx = vcx\n        vy = v0 + vcy\n        speed = sqrt(vx*vx + vy*vy)\n        x = 4*R + (a*sin(theta) + b*cos(theta) - b)/omega3\n        y0 = 0.0\n        y = y0 + v0*t + (a*(1 - cos(theta)) + b*sin(theta))/omega3\n        return {\"u\": u, \"t\": t, \"x\": x, \"y\": y, \"vx\": vx, \"vy\": vy, \"speed\": speed,\n                \"m\": m, \"q\": q, \"B\": B, \"v0\": v0, \"R\": R}", "invariants": [{"id": "c1-t-total", "why": "F7：区域Ⅰ、Ⅱ内运动总时间t=3πm/(2qB)，即第(2)问答案", "case": "c1", "expr": "abs(t[-1] - 3*pi*m[0]/(2*q[0]*B[0])) <= 0.04*3*pi*m[0]/(2*q[0]*B[0])", "report": "t[-1]"}, {"id": "c1-speed-conserved", "why": "F4/F6：磁场不做功，全程速率恒为v₀，是区域Ⅰ、Ⅱ轨道半径公式(r=mv₀/(qB))成立的前提", "case": "c1", "expr": "max(speed) - min(speed) <= 0.03*v0[0]", "report": "max(speed)-min(speed)"}, {"id": "c1-transition-u", "why": "F5：区域Ⅰ内转过π/2到达Q，占总时间t的1/3（πm/(2qB) ÷ 3πm/(2qB)），Q点为y坐标最大处", "case": "c1", "expr": "abs(u[argmax(y)] - 1/3) <= 0.02", "report": "u[argmax(y)]"}, {"id": "c1-vy-zero-at-ymax", "why": "自洽性：y取最大值处（区域Ⅰ→Ⅱ转换点Q）竖直速度分量vy必须为零，防止位置y与速度vy各自独立计算而互不自洽", "case": "c1", "expr": "abs(vy[argmax(y)]) <= 0.05*v0[0]", "report": "vy[argmax(y)]"}, {"id": "c1-regionI-radius", "why": "F4：区域Ⅰ内粒子轨道半径等于区域Ⅰ半径R（圆心C₁=(2R,0)）", "case": "c1", "expr": "abs(sqrt((interp(1/6,u,x)-2*R[0])**2 + interp(1/6,u,y)**2) - R[0]) <= 0.05*R[0]", "report": "region I curvature radius @u=1/6"}, {"id": "c1-regionII-radius", "why": "F6：区域Ⅱ内粒子轨道半径为2R（圆心C₂=(2R,-R)）", "case": "c1", "expr": "abs(sqrt((interp(2/3,u,x)-2*R[0])**2 + (interp(2/3,u,y)+R[0])**2) - 2*R[0]) <= 0.05*2*R[0]", "report": "region II curvature radius @u=2/3"}, {"id": "c1-endpoint-N", "why": "F2/F6：粒子最终在N=(4R,-R)与MN相切，几何上验证MN边界位置", "case": "c1", "expr": "abs(x[-1]-4*R[0]) <= 0.05*R[0]", "report": "x[-1]"}, {"id": "c1-endpoint-N-y", "why": "F2/F6：N点纵坐标为-R", "case": "c1", "expr": "abs(y[-1]+R[0]) <= 0.05*R[0]", "report": "y[-1]"}, {"id": "c1-x-vx-consistency", "why": "自洽性：位置x对时间的数值导数须与探针给出的vx一致", "case": "c1", "expr": "abs(mean(diff(x)/diff(t)) - mean(vx)) <= 0.05*v0[0]", "report": "mean(diff(x)/diff(t)) vs mean(vx)"}, {"id": "c1-y-vy-consistency", "why": "自洽性：位置y对时间的数值导数须与探针给出的vy一致", "case": "c1", "expr": "abs(mean(diff(y)/diff(t)) - mean(vy)) <= 0.05*v0[0]", "report": "mean(diff(y)/diff(t)) vs mean(vy)"}, {"id": "c2-vmax", "why": "F9：动能最大时总速度大小v_max=13v₀/5，第(3)问答案之一", "case": "c2", "expr": "abs(max(speed) - 13*v0[0]/5) <= 0.04*13*v0[0]/5", "report": "max(speed)"}, {"id": "c2-vmax-u", "why": "归一化定义：粒子与MN的两交点关于圆周运动最远点（动能最大点）对称，故动能最大恰发生在u=0.5", "case": "c2", "expr": "abs(u[argmax(speed)] - 0.5) <= 0.02", "report": "u[argmax(speed)]"}, {"id": "c2-xmax", "why": "F9：动能最大时粒子到y轴距离x_max=172mv₀/(25qB)，第(3)问答案之一", "case": "c2", "expr": "abs(x[argmax(speed)] - 172*R[0]/25) <= 0.05*172*R[0]/25", "report": "x[argmax(speed)]"}, {"id": "c2-vx-zero-at-xmax", "why": "自洽性：x取最大值处水平速度vx必须为零，防止position x与velocity vx各自独立计算而互不自洽（同时验证x的极值点与speed的极值点是同一时刻）", "case": "c2", "expr": "abs(vx[argmax(x)]) <= 0.05*v0[0]", "report": "vx[argmax(x)]"}, {"id": "c2-vcirc-conserved", "why": "F8：扣除漂移v_drift=(0,v₀)后的圆周分量大小|v_circ|=8v₀/5全程守恒", "case": "c2", "expr": "max(sqrt(vx**2+(vy-v0)**2)) - min(sqrt(vx**2+(vy-v0)**2)) <= 0.08*v0[0]", "report": "range of |v_circ|"}, {"id": "c2-entry-speed", "why": "粒子经区域Ⅰ、Ⅱ后速率不变，进入区域Ⅲ时速率仍为v₀", "case": "c2", "expr": "abs(speed[0]-v0[0]) <= 0.03*v0[0]", "report": "speed[0]"}, {"id": "c2-entry-x", "why": "F2：粒子经MN边界(x=4R)射入区域Ⅲ", "case": "c2", "expr": "abs(x[0]-4*R[0]) <= 0.03*R[0]", "report": "x[0]"}, {"id": "c2-x-vx-consistency", "why": "自洽性：位置x对时间的数值导数须与探针给出的vx一致", "case": "c2", "expr": "abs(mean(diff(x)/diff(t)) - mean(vx)) <= 0.05*v0[0]", "report": "mean(diff(x)/diff(t)) vs mean(vx)"}, {"id": "c2-y-vy-consistency", "why": "自洽性：位置y对时间的数值导数须与探针给出的vy一致（须包含导向中心沿y的漂移，否则与vy不自洽）", "case": "c2", "expr": "abs(mean(diff(y)/diff(t)) - mean(vy)) <= 0.05*v0[0]", "report": "mean(diff(y)/diff(t)) vs mean(vy)"}], "probe_keys": ["u", "t", "x", "y", "vx", "vy", "speed", "m", "q", "B", "v0", "R"], "disclosures": [{"why": "第(1)问答案，须在画面中直接读出", "must_contain": "U=mv₀²/(2q)，R=mv₀/(qB)"}, {"why": "第(2)问答案，须在画面中直接读出", "must_contain": "总时间t=3πm/(2qB)"}, {"why": "第(3)问答案，须在画面中直接读出", "must_contain": "动能最大时v=13v₀/5，到y轴距离=172mv₀/(25qB)"}, {"why": "三个区域场方向不同是解题关键，须明确标注避免混淆", "must_contain": "区域Ⅰ、Ⅱ磁场方向垂直纸面向外，区域Ⅲ磁场垂直纸面向里、电场沿x正方向"}], "sample_points": 401, "probe_key_meaning": {"B": "区域Ⅰ磁感应强度大小（常数数组）", "R": "区域Ⅰ半径，R=mv₀/(qB)（常数数组）", "m": "粒子质量（常数数组，每个采样点取相同值）", "q": "粒子电荷量（常数数组）", "t": "真实物理时间（s）。case c1：0到3πm/(2qB)；case c2：0到区域Ⅲ内圆周分量转过286°所需时间", "u": "归一化物理过程进度，等于传入的u。case c1：真实时间线性映射；case c2：区域Ⅲ内圆周分量转过的角度线性映射", "x": "粒子x坐标（m）", "y": "粒子y坐标（m）", "v0": "粒子射入区域Ⅰ时的速度大小（常数数组）", "vx": "粒子速度x分量（m/s）", "vy": "粒子速度y分量（m/s）", "speed": "粒子速度大小sqrt(vx²+vy²)（m/s），与动能单调对应"}, "process_endpoints": "case c1：u=0为粒子从P点以速度(0,v₀)射入区域Ⅰ的时刻；u=1/3为粒子到达Q点、以速度(v₀,0)射入区域Ⅱ的时刻；u=1为粒子到达N点（轨迹与MN相切，是该组粒子中在区域Ⅱ内运动时间最短的临界情形）的时刻。case c2：u=0为粒子经MN边界以与y轴负方向成74°角射入区域Ⅲ的时刻；u=0.5为粒子动能最大（速度13v₀/5，到y轴距离172mv₀/25R）的时刻；u=1为粒子圆周分量转回MN边界(x=4R)、即将折返区域Ⅱ的时刻。", "scene_requirements": ["圆形区域Ⅰ（与x轴切于P、与y轴切于S，标注圆心O₁与半径R）及其内部垂直纸面向外的磁场标记", "半圆形区域Ⅱ（标注圆心O₂、直径端点M、N，半径2R）及其内部垂直纸面向外（B/2）的磁场标记，与区域Ⅰ相切于Q点", "MN竖直线作为区域Ⅲ左边界，区域Ⅲ内叠加垂直纸面向里的磁场B与沿x正方向的电场E=Bv₀标记", "P点下方的加速电场与粒子源示意，以及OF发射范围标注", "case c1对应粒子的完整轨迹：区域Ⅰ内P→Q四分之一圆弧、区域Ⅱ内Q→N四分之一圆弧（与MN相切），并标注R、2R与总时间t=3πm/(2qB)", "case c2对应粒子在区域Ⅲ内的轨迹：入射角74°标注、导向中心沿+y漂移的示意、动能最大时刻的位置与速度标注（13v₀/5，到y轴距离172mv₀/(25qB)）", "关键数值读出面板：U、R、t、v_max、x_max"]};
    out.scenes = Object.keys(window.Scenes || {});
    var fig = document.querySelector('figure[data-scene="' + SID + '"]');
    if (!fig) { out.errors.push("DOM 里找不到 figure[data-scene=" + SID + "]"); throw 0; }
    var api = (window.__api || {})[SID];
    if (!api) { out.errors.push("运行时未能构造该场景（工厂抛错或契约不符）"); throw 0; }
    ["step","reset","probe"].forEach(function(k){
      if (typeof api[k] !== "function") out.errors.push("api." + k + " 不是函数");
    });
    if (out.errors.length) throw 0;

    var svg = fig.querySelector("svg");

    // --- 渲染压力：跑 451 帧 step()，抓异常与脏数值 ---
    try {
      api.reset(); api.step(0);
      for (var t = 0; t <= 18.0001; t += 0.04) api.step(t);
    } catch (e) { rec("step() 抛异常: " + e); }
    var dom = svg.outerHTML;
    ["NaN","Infinity","undefined","null"].forEach(function(w){
      var n = (dom.match(new RegExp(w, "g")) || []).length;
      if (n) out.errors.push("渲染后 SVG 中出现 " + w + " ×" + n);
    });

    /* --- L3.5 渲染覆盖 ---
       断言只跑 probe，看不见渲染。历史教训：把 translate(cx,cy) rotate(θ)
       误写成 rotate(θ cx cy)，整组元素飞出画布，四层门禁 13/13 全绿放行。
       这里补上：每个带 id 的 SVG 元素，必须在某一采样时刻真的画在 viewBox 内。
       只查「位置」不查「可见性」—— opacity=0 的元素 getBBox 依然有效，
       所以合法隐藏的结论框不会被误伤，而「整组飞出画布」是全时段的，必然被抓。*/
    try {
      api.reset();
      var vb = svg.viewBox.baseVal;
      var els = svg.querySelectorAll("[id]");
      var ids = [], everOK = {}, everDrawn = {}, snaps = [];
      for (var q0 = 0; q0 < els.length; q0++) ids.push(els[q0].getAttribute("id"));
      /* 注意：不能用 el.getCTM() —— 它含 viewBox 缩放，返回的是渲染像素坐标，
         拿去和 viewBox 数值比会把右下方的元素全部误判出界。
         正确做法是经 svg 根的 screenCTM 求逆，换回 viewBox 用户单位。 */
      for (var tq = 0; tq <= 20.0001; tq += 0.5) {
        api.step(tq);
        snaps.push(svg.innerHTML);
        var rootM = svg.getScreenCTM();
        if (!rootM) continue;
        var invM = rootM.inverse();
        for (var q1 = 0; q1 < els.length; q1++) {
          var idq = ids[q1];
          if (everOK[idq]) continue;
          var bb, mm;
          try { bb = els[q1].getBBox(); mm = els[q1].getScreenCTM(); } catch (err0) { continue; }
          if (!mm) continue;
          if (bb.width <= 0 && bb.height <= 0) continue;   /* 退化元素不判位置 */
          everDrawn[idq] = true;
          mm = invM.multiply(mm);                          /* → viewBox 用户单位 */
          var cxq = bb.x + bb.width / 2, cyq = bb.y + bb.height / 2;
          var XQ = mm.a * cxq + mm.c * cyq + mm.e;
          var YQ = mm.b * cxq + mm.d * cyq + mm.f;
          if (XQ >= vb.x - 2 && XQ <= vb.x + vb.width + 2 &&
              YQ >= vb.y - 2 && YQ <= vb.y + vb.height + 2)
            everOK[idq] = true;
        }
      }
      var off = [], dead = [];
      for (var q2 = 0; q2 < ids.length; q2++) {
        if (!everDrawn[ids[q2]]) dead.push(ids[q2]);
        else if (!everOK[ids[q2]]) off.push(ids[q2]);
      }
      if (off.length)
        out.render.push("这些元素在全部 41 个采样时刻都画在 viewBox 之外（画面上看不到）：" + off.join(", "));
      var moved = false;
      for (var q3 = 1; q3 < snaps.length; q3++) if (snaps[q3] !== snaps[0]) { moved = true; break; }
      if (!moved)
        out.render.push("采样了 " + snaps.length + " 个不同时刻，SVG 内容完全没有变化——动画没有动");
      out.notes.push("渲染覆盖：" + ids.length + " 个带 id 元素，" +
                     Object.keys(everOK).length + " 个曾正常出现在画面内" +
                     (dead.length ? "，" + dead.length + " 个全程无几何(" + dead.slice(0, 6).join(",") + ")" : ""));
    } catch (errR) { out.render.push("渲染覆盖检查自身失败: " + errR); }

    // --- probe 采样 ---
    var N = SPEC.sample_points || 401;
    for (var ci = 0; ci < SPEC.cases.length; ci++) {
      var cid = SPEC.cases[ci].id;
      var cols = {}; SPEC.probe_keys.forEach(function(k){ cols[k] = []; });

      // 纯度 + 无副作用
      var before = svg.outerHTML;
      var a1 = api.probe(0.37, cid), a2 = api.probe(0.37, cid);
      if (svg.outerHTML !== before) out.errors.push("[" + cid + "] probe() 修改了 DOM（必须是纯函数）");
      SPEC.probe_keys.forEach(function(k){
        if (!(k in a1)) out.errors.push("[" + cid + "] probe 返回值缺少键 " + k);
        else if (a1[k] !== a2[k]) out.errors.push("[" + cid + "] probe 不纯：同一 u 两次调用 " + k + " 不同（" + a1[k] + " vs " + a2[k] + "）");
      });

      var nbad = 0;
      for (var i = 0; i < N; i++) {
        var u = i / (N - 1);
        var r;
        try { r = api.probe(u, cid); }
        catch (e) { out.errors.push("[" + cid + "] probe(" + u.toFixed(3) + ") 抛异常: " + e); break; }
        for (var ki = 0; ki < SPEC.probe_keys.length; ki++) {
          var k = SPEC.probe_keys[ki], v = r ? r[k] : undefined;
          if (typeof v !== "number" || !isFinite(v)) { nbad++; v = null; }
          cols[k].push(v);
        }
      }
      if (nbad) out.errors.push("[" + cid + "] probe 返回了 " + nbad + " 个非有限数值");
      out.series[cid] = cols;
    }
    out.ok = out.errors.length === 0 && out.render.length === 0;
  } catch (e) { if (e) rec(e); }
  document.getElementById("TESTOUT").textContent = "@@" + JSON.stringify(out) + "@@";
}
/* 必须等运行时 boot 完（它也挂在 DOMContentLoaded 上，且注册在前），
   同时保证 <pre id="TESTOUT"> 已经存在 */
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", __runProbe);
else __runProbe();
</script>
<pre id="TESTOUT"></pre>
