<figcaption>球1从N以v0出发，经P点后速度增至2v0，在M与静止的球2发生弹性碰撞；由动量与能量守恒、且碰后两球速度大小相等解得 m₂=3m，碰后 vA=-v0、vB=+v0。此后球1沿轨道折返再次经过P点（速度增至-2v0），历时 5πR/(6v0) 后与沿另一侧运动的球2相遇，发生第二次碰撞。第一次经过P点后瞬间的向心力 F=m(2v0)²/R=4mv0²/R。</figcaption></figure>
