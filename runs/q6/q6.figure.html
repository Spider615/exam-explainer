<figure data-scene="q6"><svg viewBox="0 0 560 320" role="img" aria-label="超声波检测机翼缺陷：表面反射与缺陷反射信号在探头处叠加">

  <!-- 面板标题 -->
  <text class="u" x="10" y="14">机翼横截面与超声波探伤（示意）</text>
  <text class="u" x="205" y="14">探头接收信号 y-t 波形</text>

  <!-- ===== 左侧：机翼横截面 + 波前位置动画 ===== -->
  <!-- 机翼外表面 -->
  <line class="sk" x1="20" y1="42" x2="185" y2="42"></line>
  <text class="u" x="20" y="54">机翼表面</text>

  <!-- 探头 -->
  <rect class="sk" x="90" y="20" width="30" height="22" fill="none"></rect>
  <text class="u" x="64" y="34">探头</text>

  <!-- 机翼材料内部（缺陷所在体） -->
  <rect class="wash-a" x="20" y="42" width="165" height="193"></rect>

  <!-- 波前往返参考线（沿深度方向），圆点位置对应p(t) -->
  <line id="q6-depthline" class="sc" x1="105" y1="42" x2="105" y2="160.13"></line>
  <circle id="q6-front" class="fa" cx="105" cy="42" r="5"></circle>

  <!-- 缺陷标记 -->
  <line id="q6-defect" class="sr" x1="80" y1="160.13" x2="130" y2="160.13"></line>
  <text class="u r" x="134" y="164">缺陷</text>

  <!-- 深度d标注 -->
  <line class="sh" x1="150" y1="42" x2="150" y2="160.13" marker-start="url(#ak)" marker-end="url(#ak)"></line>
  <text x="153" y="108">d=4.725mm</text>

  <!-- 实时读数 -->
  <text id="q6-info" class="n" x="10" y="250">t=0.00μs p=0.00mm y_sum=0.00</text>

  <!-- ===== 右侧：y-t 波形图 ===== -->
  <text x="480" y="26">t/μs</text>

  <!-- 零位基准线 -->
  <line class="sh" x1="244" y1="60" x2="548" y2="60"></line>
  <line class="sh" x1="244" y1="128" x2="548" y2="128"></line>
  <line class="sh" x1="244" y1="196" x2="548" y2="196"></line>

  <!-- Δt=1.5μs 到达时刻参考线（跨三条波形图） -->
  <line class="sc" x1="442.26" y1="34" x2="442.26" y2="222"></line>

  <!-- 当前时间游标 -->
  <line id="q6-cursor" class="sh" x1="244" y1="34" x2="244" y2="222"></line>

  <!-- 三条波形曲线 -->
  <path id="q6-yb" class="sa" fill="none" d="M244.00 60.00"></path>
  <text x="206" y="64">y_b</text>

  <path id="q6-yc" class="sr" fill="none" d="M244.00 128.00"></path>
  <text x="206" y="132">y_c</text>

  <path id="q6-ysum" class="sk" fill="none" d="M244.00 196.00"></path>
  <text x="206" y="200">y_sum</text>

  <!-- t轴刻度 -->
  <text class="n" x="240" y="232">0</text>
  <text class="n" x="524" y="232">2.3</text>

  <!-- ===== 底部：图例 + 数值披露 + 结论 ===== -->
  <text class="u a" x="10" y="262">y_b(蓝)=表面反射</text>
  <text class="u r" x="200" y="262">y_c(红)=缺陷反射</text>
  <text class="u" x="390" y="262">y_sum(黑)=叠加信号</text>

  <text x="10" y="282">T=0.2μs</text>
  <text x="110" y="282">Δt=1.5μs</text>
  <text x="220" y="282">Δφ=15π</text>
  <text x="310" y="282">v=6300m/s</text>
  <text x="430" y="282">d=4.725mm</text>

  <text class="u r" x="10" y="302">结论：Δφ=15π为π奇数倍，两波反相相消，振动减弱</text>

</svg>
<figcaption class="u">探头在t=0接收到机翼表面反射信号(蓝，y_b)，在t=1.5μs接收到缺陷反射信号(红，y_c)，两者周期均为T=0.2μs、起振方向均向上。左图圆点沿深度方向往返运动，展示缺陷回波波前位置p(t)先增大到d再减小到0的过程；右图三条曲线随时间延伸绘制。因相位差Δφ=15π为π的奇数倍，t≥1.5μs后两波反相叠加、总位移y_sum(黑)趋于恒为0，即振动减弱；由d=v·Δt/2算得缺陷深度d=4.725mm。</figcaption></figure>
