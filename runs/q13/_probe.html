<script>window.Scenes = {};</script>
<script>window.Scenes["q13"] = function (fig) {
  var svg = fig.querySelector('svg');
  var cycleAB = fig.querySelector('#q13-cycleAB');
  var cycleCD = fig.querySelector('#q13-cycleCD');
  var current = fig.querySelector('#q13-current');
  var infoPhase = fig.querySelector('#q13-info-phase');
  var infoP = fig.querySelector('#q13-info-p');
  var infoV = fig.querySelector('#q13-info-V');
  var infoT = fig.querySelector('#q13-info-T');

  // ---- 权威常数（与 spec.constants / reference 完全一致，不得改动力的形式）----
  var PA = 800000.0, PB = 400000.0, PC = 100000.0, PD = 200000.0;
  var V1 = 1.0, V2 = 2.0, T1 = 1200.0, T2 = 300.0;

  // ---- 像素布局（纯渲染用，不参与物理计算）----
  var X0 = 60, VSCALE = 136;
  var Y0 = 260, PSCALE = 220 / 900000;

  function v2x(V) { return X0 + V * VSCALE; }
  function p2y(p) { return Y0 - p * PSCALE; }

  // 与 spec.reference 完全一致的纯物理函数：只依据 (u, caseId) 计算
  function physics(u, caseId) {
    var t, V, T, p;
    u = Math.max(0, Math.min(1, u));
    if (u <= 0.25) {
      t = u / 0.25;
      V = V1 + (V2 - V1) * t;
      T = T1;
      p = PA * V1 / V;
    } else if (u <= 0.5) {
      t = (u - 0.25) / 0.25;
      V = V2;
      T = T1 + (T2 - T1) * t;
      p = PB * T / T1;
    } else if (u <= 0.75) {
      t = (u - 0.5) / 0.25;
      V = V2 + (V1 - V2) * t;
      T = T2;
      p = PC * V2 / V;
    } else {
      t = (u - 0.75) / 0.25;
      V = V1;
      T = T2 + (T1 - T2) * t;
      p = PD * T / T2;
    }
    return { u: u, p: p, V: V, T: T };
  }

  // 预先算好 AB、CD 两条等温双曲线（pV=常数）的作图路径：常数已定，只需算一次
  function buildIsotherm(Vstart, Vend, pvConst, steps) {
    var d = '', i, V, p, x, y;
    for (i = 0; i <= steps; i++) {
      V = Vstart + (Vend - Vstart) * i / steps;
      p = pvConst / V;
      x = v2x(V); y = p2y(p);
      d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2) + ' ';
    }
    return d;
  }
  cycleAB.setAttribute('d', buildIsotherm(V1, V2, PA * V1, 24));
  cycleCD.setAttribute('d', buildIsotherm(V2, V1, PC * V2, 24));

  function phaseLabel(u) {
    if (u <= 0.25) return 'AB：等温膨胀';
    if (u <= 0.5) return 'BC：等容降压';
    if (u <= 0.75) return 'CD：等温压缩';
    return 'DA：等容升压';
  }

  function render(u) {
    var s = physics(u, 'c1');
    current.setAttribute('cx', v2x(s.V).toFixed(2));
    current.setAttribute('cy', p2y(s.p).toFixed(2));
    infoPhase.textContent = phaseLabel(u);
    infoP.textContent = 'p = ' + s.p.toFixed(0) + ' Pa';
    infoV.textContent = 'V = ' + s.V.toFixed(2) + ' m³';
    infoT.textContent = 'T = ' + s.T.toFixed(0) + ' K';
  }

  var CYCLE = 8.0;

  return {
    step: function (t) {
      var u = (t % CYCLE) / CYCLE;
      render(u);
    },
    reset: function () {
      render(0);
    },
    probe: function (u, caseId) {
      return physics(u, caseId);
    }
  };
};
</script>
<script>/* ===== 动画运行时 ===== */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var live = [];

  function build(fig) {
    var id = fig.getAttribute('data-scene');
    var factory = window.Scenes[id];
    if (typeof factory !== 'function') return null;
    var api;
    try { api = factory(fig); } catch (e) { console.error('[scene ' + id + '] setup failed', e); return null; }
    if (!api || typeof api.step !== 'function') { console.error('[scene ' + id + '] bad contract'); return null; }

    var bar = document.createElement('div');
    bar.className = 'ctlbar';
    var pp = document.createElement('button');
    pp.type = 'button'; pp.className = 'btn pp';
    var rp = document.createElement('button');
    rp.type = 'button'; rp.className = 'btn'; rp.textContent = '重播';
    var tag = document.createElement('span');
    tag.className = 'livebadge'; tag.textContent = 'LIVE';
    bar.appendChild(pp); bar.appendChild(rp); bar.appendChild(tag);
    var own = fig.querySelector('.ctl');
    if (own) bar.appendChild(own);
    var cap = fig.querySelector('figcaption');
    fig.insertBefore(bar, cap);

    window.__api = window.__api || {}; window.__api[id] = api;
    var s = { id: id, api: api, t: 0, playing: !reduce, visible: true, fig: fig, pp: pp };
    function paint() {
      pp.textContent = s.playing ? '暂停' : '播放';
      pp.setAttribute('aria-pressed', s.playing ? 'true' : 'false');
      pp.setAttribute('aria-label', (s.playing ? '暂停' : '播放') + '动画');
      tag.style.opacity = s.playing ? '.9' : '.3';
    }
    pp.addEventListener('click', function () { s.playing = !s.playing; paint(); });
    rp.addEventListener('click', function () {
      s.t = 0;
      try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] reset', e); }
    });
    paint();
    try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] first frame', e); }

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { s.visible = es[0].isIntersecting; },
        { rootMargin: '120px' }).observe(fig);
    }
    return s;
  }

  function boot() {
    var figs = document.querySelectorAll('figure[data-scene]');
    for (var i = 0; i < figs.length; i++) {
      var s = build(figs[i]);
      if (s) live.push(s);
    }
    var g = document.getElementById('gswitch');
    if (g) {
      g.addEventListener('click', function () {
        var anyOn = live.some(function (s) { return s.playing; });
        live.forEach(function (s) { if (s.playing === anyOn) s.pp.click(); });
        g.textContent = anyOn ? '▶ 全部播放' : '⏸ 全部暂停';
      });
      g.textContent = reduce ? '▶ 全部播放' : '⏸ 全部暂停';
    }
    var last = 0;
    function frame(now) {
      var dt = last ? Math.min((now - last) / 1000, 1 / 30) : 0;
      last = now;
      for (var i = 0; i < live.length; i++) {
        var s = live[i];
        if (!s.playing || !s.visible) continue;
        s.t += dt;
        try { s.api.step(s.t); }
        catch (e) { console.error('[scene ' + s.id + '] step', e); s.playing = false; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
