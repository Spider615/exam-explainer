<meta charset="utf-8">
<title>probe</title>
<style>
:root{
  --paper:#F2F4F7; --panel:#FFFFFF; --stem:#FAFBFC;
  --ink:#15191F; --ink2:#5A6472; --ink3:#8A94A3;
  --line:#C9D2DE; --hair:#E4E9F0;
  --acc:#2B5490; --acc2:#E9EFF8;
  --cy:#0C8CAE; --cy2:#E2F2F6;
  --red:#AE3B2B; --red2:#FBEBE7;
  --cjk:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --math:"Times New Roman",Georgia,serif;
  --song:Songti SC,SimSun,serif;
}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--cjk)}
figure{margin:0;background:var(--panel);border:1px solid var(--line)}
figure svg{display:block;width:100%;height:auto}
figcaption{font-size:11.5px;color:var(--ink3);padding:6px 12px;border-top:1px solid var(--hair)}
svg text{font-family:var(--math);font-size:13px;fill:var(--ink);font-style:italic}
svg text.u{font-family:var(--cjk);font-style:normal;font-size:11.5px;fill:var(--ink2)}
svg text.n{font-family:var(--mono);font-style:normal;font-size:11px;fill:var(--ink2)}
svg text.a{fill:var(--acc)}svg text.r{fill:var(--red)}svg text.c{fill:var(--cy)}
.sk{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.sh{stroke:var(--line);fill:none;stroke-width:1}
.sa{stroke:var(--acc);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sr{stroke:var(--red);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sc{stroke:var(--cy);fill:none;stroke-width:1.5;stroke-dasharray:5 4}
.fk{fill:var(--ink)}.fa{fill:var(--acc)}.fr{fill:var(--red)}.fc{fill:var(--cy)}
.wash-a{fill:var(--acc);opacity:.13}.wash-r{fill:var(--red);opacity:.14}.wash-c{fill:var(--cy);opacity:.16}
.ctlbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;border-top:1px solid var(--hair)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.btn{font-family:var(--cjk);font-size:11.5px;line-height:1;padding:5px 10px;border-radius:3px;
     border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.livebadge{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--red)}
input[type=range]{width:120px}
</style>

 * 老场景只知道 t % 自己内部的周期，宿主拿不到总时长就画不出刻度。

(function () {

    return b;
  }

  function build(fig) {
    var id = fig.getAttribute('data-scene');
    var factory = window.Scenes[id];
    if (typeof factory !== 'function') return null;
    var api;
    try { api = factory(fig); } catch (e) { console.error('[scene ' + id + '] setup failed', e); return null; }
    if (!api || typeof api.step !== 'function') { console.error('[scene ' + id + '] bad contract'); return null; }

    // 两样都齐才认为能拖：只有 duration 没有 seek 的话，拖了也没反应
    var seekable = (typeof api.seek === 'function' &&
                    typeof api.duration === 'number' && api.duration > 0);

    var bar = document.createElement('div');
    bar.className = 'ctlbar';
    var pp = mkbtn('', 'pp');
    var rp = mkbtn('重播');
    var tag = document.createElement('span');
    tag.className = 'livebadge'; tag.textContent = 'LIVE';
    bar.appendChild(pp); bar.appendChild(rp);

    var s = { id: id, api: api, t: 0, playing: !reduce, visible: true,

    var range = null, num = null;
    if (seekable) {
      range = document.createElement('input');
      range.type = 'range'; range.min = '0'; range.max = '1'; range.step = '0.001';

      num = document.createElement('span');

    pp.addEventListener('click', function () { s.playing = !s.playing; paint(); });
    rp.addEventListener('click', function () {

    if (range) {

    }

      var u = (s.t / api.duration) % 1;

      else if (e.key === 'ArrowLeft') { e.preventDefault(); s.playing = false; paint(); seekTo(u - d); }

          var r = s.fig.querySelector('.ctlbar input[type=range]');
          var n = s.fig.querySelector('.ctlbar .ctl-num');
          if (r) r.value = String(u);
          if (n) n.textContent = Math.round(u * 100) + '%';
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

          for (var u5 = 0; u5 < 2; u5++) for (var v5 = 0; v5 < 2; v5++) {
            var xx = m5.a * px[u5] + m5.c * py[v5] + m5.e;
            var yy = m5.b * px[u5] + m5.d * py[v5] + m5.f;
            if (xx < X0) X0 = xx; if (xx > X1) X1 = xx;
            if (yy < Y0) Y0 = yy; if (yy > Y1) Y1 = yy;
          }
          bx.push({x0: X0, x1: X1, y0: Y0, y1: Y1});
        }
        for (var i5 = 0; i5 < NT; i5++) { var A5 = bx[i5]; if (!A5) continue;
          for (var j5 = i5 + 1; j5 < NT; j5++) { var B5 = bx[j5]; if (!B5) continue;
            var w5 = Math.min(A5.x1, B5.x1) - Math.max(A5.x0, B5.x0);
            var h5 = Math.min(A5.y1, B5.y1) - Math.max(A5.y0, B5.y0);
            if (w5 <= 0 || h5 <= 0) continue;
            var d5 = w5 < h5 ? w5 : h5, key5 = i5 + "_" + j5;
            if (!worst[key5] || d5 > worst[key5].d)
              worst[key5] = {d: d5, w: w5, h: h5, t: tv, i: i5, j: j5,
                             a: [A5.x0, A5.y0, A5.x1, A5.y1],
                             b: [B5.x0, B5.y0, B5.x1, B5.y1]};
          }
        }
      }
      /* 步长 0.25：判据的量词是「∃某一帧」，欠采样会直接漏判，
         而 81 帧全量文字包围盒实测只要几毫秒，占整轮不到 1%。 */
      frame5(0);
      for (var t5 = 0; t5 <= 20.0001; t5 += 0.25) { api.step(t5); frame5(t5); }
      var lfails = [], lwarn = 0;
      for (var k6 in worst) { if (!worst.hasOwnProperty(k6)) continue;
        var r6 = worst[k6];
        if (r6.d >= L5_FAIL) {
          lfails.push("「" + tinfo[r6.i] + "」与「" + tinfo[r6.j] + "」在 t=" +
            r6.t.toFixed(2) + "s 压在一起：重叠 " + r6.w.toFixed(1) + "×" + r6.h.toFixed(1) +
            "px（短边 " + r6.d.toFixed(1) + " ≥ " + L5_FAIL + "）。前者盒 [" +
            r6.a[0].toFixed(0) + "," + r6.a[1].toFixed(0) + "]-[" + r6.a[2].toFixed(0) + "," + r6.a[3].toFixed(0) +
            "]，后者盒 [" + r6.b[0].toFixed(0) + "," + r6.b[1].toFixed(0) + "]-[" + r6.b[2].toFixed(0) + "," + r6.b[3].toFixed(0) + "]");
        } else if (r6.d >= L5_WARN) lwarn++;
      }
      lfails.sort();
      out.layout = {fails: lfails, warns: lwarn, nText: NT, nMark: nMark};
      api.reset();
    } catch (errL) { out.layout = {fails: [], warns: 0, nText: 0, nMark: 0,
                                   self: "版面检查自身失败: " + errL}; }

    // --- probe 采样 ---
    var N = SPEC.sample_points || 401;
    for (var ci = 0; ci < SPEC.cases.length; ci++) {
      var cid = SPEC.cases[ci].id;
      var cols = {}; SPEC.probe_keys.forEach(function(k){ cols[k] = []; });

      // 纯度 + 无副作用
      var before = svg.outerHTML;
      var a1 = api.probe(0.37, cid), a2 = api.probe(0.37, cid);
      if (svg.outerHTML !== before) out.errors.push("[" + cid + "] probe() 修改了 DOM（必须是纯函数）");
      SPEC.probe_keys.forEach(function(k){
        if (!(k in a1)) out.errors.push("[" + cid + "] probe 返回值缺少键 " + k);
        else if (a1[k] !== a2[k]) out.errors.push("[" + cid + "] probe 不纯：同一 u 两次调用 " + k + " 不同（" + a1[k] + " vs " + a2[k] + "）");
      });

      var nbad = 0;
      for (var i = 0; i < N; i++) {
        var u = i / (N - 1);
        var r;
        try { r = api.probe(u, cid); }
        catch (e) { out.errors.push("[" + cid + "] probe(" + u.toFixed(3) + ") 抛异常: " + e); break; }
        for (var ki = 0; ki < SPEC.probe_keys.length; ki++) {
          var k = SPEC.probe_keys[ki], v = r ? r[k] : undefined;
          if (typeof v !== "number" || !isFinite(v)) { nbad++; v = null; }
          cols[k].push(v);
        }
      }
      if (nbad) out.errors.push("[" + cid + "] probe 返回了 " + nbad + " 个非有限数值");
      out.series[cid] = cols;
    }
    out.ok = out.errors.length === 0 && out.render.length === 0;
  } catch (e) { if (e) rec(e); }
  document.getElementById("TESTOUT").textContent = "@@" + JSON.stringify(out) + "@@";
}
/* 必须等运行时 boot 完（它也挂在 DOMContentLoaded 上，且注册在前），
   同时保证 <pre id="TESTOUT"> 已经存在 */
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", __runProbe);
else __runProbe();
</script>
<pre id="TESTOUT"></pre>
