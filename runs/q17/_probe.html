<style>
:root{
  --paper:#F2F4F7; --panel:#FFFFFF; --stem:#FAFBFC;
  --ink:#15191F; --ink2:#5A6472; --ink3:#8A94A3;
  --line:#C9D2DE; --hair:#E4E9F0;

}

figure{margin:0;background:var(--panel);border:1px solid var(--line)}
figure svg{display:block;width:100%;height:auto}
figcaption{font-size:11.5px;color:var(--ink3);padding:6px 12px;border-top:1px solid var(--hair)}
svg text{font-family:var(--math);font-size:13px;fill:var(--ink);font-style:italic}
svg text.u{font-family:var(--cjk);font-style:normal;font-size:11.5px;fill:var(--ink2)}
svg text.n{font-family:var(--mono);font-style:normal;font-size:11px;fill:var(--ink2)}
svg text.a{fill:var(--acc)}svg text.r{fill:var(--red)}svg text.c{fill:var(--cy)}
.sk{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.sh{stroke:var(--line);fill:none;stroke-width:1}
.sa{stroke:var(--acc);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sr{stroke:var(--red);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sc{stroke:var(--cy);fill:none;stroke-width:1.5;stroke-dasharray:5 4}
.fk{fill:var(--ink)}.fa{fill:var(--acc)}.fr{fill:var(--red)}.fc{fill:var(--cy)}
.wash-a{fill:var(--acc);opacity:.13}.wash-r{fill:var(--red);opacity:.14}.wash-c{fill:var(--cy);opacity:.16}
.ctlbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;border-top:1px solid var(--hair)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.btn{font-family:var(--cjk);font-size:11.5px;line-height:1;padding:5px 10px;border-radius:3px;
     border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.livebadge{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--red)}
input[type=range]{width:120px}
</style>

<figure data-scene="q17"><svg viewBox="0 0 560 300" role="img" aria-label="竖直上抛物体在最高点炸裂为A、B两部分的平抛运动演示">

<figcaption>竖直上抛物体（初速v0）经时间t到达最高点后炸裂为A（2m）、B（m）两部分：A以水平速度v飞出，B以速度vB反向飞出。u为物理过程进度（非播放时间），炸裂发生在u=0.5。图中固定取g=10 m/s²，t=1 s，v=2 m/s（示例取值），结论v0=gt、vB=2v、落地点间距 d = 3vt 对任意数值均成立。</figcaption></figure>


<script>window.Scenes = {};</script>
<script>window.Scenes["q17"] = function (fig) {
  var svg = fig.querySelector('svg');
  var riselane = fig.querySelector('#q17-riselane');
  var pathA = fig.querySelector('#q17-pathA');
  var pathB = fig.querySelector('#q17-pathB');
  var obj = fig.querySelector('#q17-obj');
  var ballA = fig.querySelector('#q17-ballA');
  var ballB = fig.querySelector('#q17-ballB');
  var labelA = fig.querySelector('#q17-labelA');
  var labelB = fig.querySelector('#q17-labelB');
  var arrowA = fig.querySelector('#q17-arrowA');
  var arrowB = fig.querySelector('#q17-arrowB');
  var landA = fig.querySelector('#q17-landA');
  var landB = fig.querySelector('#q17-landB');
  var dspan = fig.querySelector('#q17-dspan');
  var dlabel = fig.querySelector('#q17-dlabel');
  var tauDisplay = fig.querySelector('#q17-tau-display');
  var uDisplay = fig.querySelector('#q17-u-display');
  var phaseDisplay = fig.querySelector('#q17-phase-display');
  var yDisplay = fig.querySelector('#q17-y-display');

  // ---- 权威常数（与 spec.constants / reference 一致，不得改动力的形式）----
  var G = 10.0;
  var T = 1.0;
  var V = 2.0;
  var V0 = G * T;          // 10
  var VB = 2.0 * V;         // 4
  var H = G * T * T / 2;    // 5

  // ---- 像素布局（纯渲染用，不参与物理计算）----
  var GY = 230;             // 地面像素 y
  var S = 30;                // 像素/米
  var OX = 220;              // 抛出点像素 x
  var TOPY = GY - H * S;     // 最高点像素 y
  var ARROW_LEN = 25;

  // ---- 动画节奏：ANIM_T 秒内 u 从0线性走到1，随后停留 HOLD_T 秒再循环 ----
  var ANIM_T = 4.0;
  var HOLD_T = 1.2;
  var CYCLE = ANIM_T + HOLD_T;

  // 与 spec.reference 完全一致的纯物理函数：只依据 (u, caseId) 计算
  function physics(u, caseId) {
    var tau = 2.0 * T * u;
    var y = V0 * tau - 0.5 * G * tau * tau;
    var vy = V0 - G * tau;
    var ay = -G;
    var xA, vAx, xB, vBx;
    if (tau <= T) {
      xA = 0.0; vAx = 0.0; xB = 0.0; vBx = 0.0;
    } else {
      var dt = tau - T;
      xA = V * dt; vAx = V;
      xB = -VB * dt; vBx = -VB;
    }
    return {
      u: u, tau: tau, y: y, vy: vy, ay: ay,
      xA: xA, vAx: vAx, xB: xB, vBx: vBx
    };
  }

  function toPx(x) { return OX + x * S; }
  function toPy(y) { return GY - y * S; }

  // 预先算好炸裂后的抛物线参考轨迹（常数已定，只需算一次）
  function buildTrajectory(vx) {
    var N = 20;
    var d = '';
    for (var i = 0; i <= N; i++) {
      var tau = T + (T * i / N);
      var dt = tau - T;
      var x = vx * dt;
      var y = V0 * tau - 0.5 * G * tau * tau;
      var px = toPx(x), py = toPy(y);
      d += (i === 0 ? 'M' : 'L') + px.toFixed(2) + ' ' + py.toFixed(2) + ' ';
    }
    return d;
  }

  pathA.setAttribute('d', buildTrajectory(V));
  pathB.setAttribute('d', buildTrajectory(-VB));

  function render(u) {
    var data = physics(u, 'c1');
    var exploded = u >= 0.5;
    var landed = u >= 0.999999;

    // 炸裂前：物体沿竖直方向上升/(共用曲线)的轨迹
    if (!exploded) {
      riselane.setAttribute('y2', toPy(data.y).toFixed(2));
    } else {
      riselane.setAttribute('y2', TOPY.toFixed(2));
    }

    obj.setAttribute('opacity', exploded ? '0' : '1');
    obj.setAttribute('cy', toPy(data.y).toFixed(2));

    var cxA = toPx(data.xA), cyA = toPy(data.y);
    var cxB = toPx(data.xB), cyB = toPy(data.y);

    ballA.setAttribute('opacity', exploded ? '1' : '0');
    ballA.setAttribute('cx', cxA.toFixed(2));
    ballA.setAttribute('cy', cyA.toFixed(2));

    ballB.setAttribute('opacity', exploded ? '1' : '0');
    ballB.setAttribute('cx', cxB.toFixed(2));
    ballB.setAttribute('cy', cyB.toFixed(2));

    labelA.setAttribute('opacity', exploded ? '1' : '0');
    labelA.setAttribute('x', (cxA - 18).toFixed(2));
    labelA.setAttribute('y', (cyA - 14).toFixed(2));

    labelB.setAttribute('opacity', exploded ? '1' : '0');
    labelB.setAttribute('x', (cxB - 40).toFixed(2));
    labelB.setAttribute('y', (cyB - 14).toFixed(2));

    arrowA.setAttribute('opacity', exploded ? '1' : '0');
    arrowA.setAttribute('x1', cxA.toFixed(2));
    arrowA.setAttribute('y1', cyA.toFixed(2));
    arrowA.setAttribute('x2', (cxA + ARROW_LEN).toFixed(2));
    arrowA.setAttribute('y2', cyA.toFixed(2));

    arrowB.setAttribute('opacity', exploded ? '1' : '0');
    arrowB.setAttribute('x1', cxB.toFixed(2));
    arrowB.setAttribute('y1', cyB.toFixed(2));
    arrowB.setAttribute('x2', (cxB - ARROW_LEN).toFixed(2));
    arrowB.setAttribute('y2', cyB.toFixed(2));

    landA.setAttribute('opacity', landed ? '1' : '0');
    landB.setAttribute('opacity', landed ? '1' : '0');
    dspan.setAttribute('opacity', landed ? '1' : '0');
    dlabel.setAttribute('opacity', landed ? '1' : '0');

    tauDisplay.textContent = 'τ = ' + data.tau.toFixed(2) + ' s';
    uDisplay.textContent = 'u = ' + u.toFixed(2);
    yDisplay.textContent = 'y = ' + Math.max(data.y, 0).toFixed(2) + ' m';
    if (!exploded) {
      phaseDisplay.textContent = '阶段：上升';
    } else if (!landed) {
      phaseDisplay.textContent = '阶段：下落（A、B已分离）';
    } else {
      phaseDisplay.textContent = '阶段：已同时落地';
    }
  }

  return {
    step: function (t) {
      var m = t % CYCLE;
      var u = (m <= ANIM_T) ? (m / ANIM_T) : 1.0;
      render(u);
    },

    reset: function () {
      // 场景无内部累积状态：render() 完全由 u 纯推导，这里无需清空任何东西。
    },

    probe: function (u, caseId) {
      return physics(u, caseId);
    }
  };
};
</script>
<script>/* ===== 动画运行时 ===== */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var live = [];

  function build(fig) {
    var id = fig.getAttribute('data-scene');
    var factory = window.Scenes[id];
    if (typeof factory !== 'function') return null;
    var api;
    try { api = factory(fig); } catch (e) { console.error('[scene ' + id + '] setup failed', e); return null; }
    if (!api || typeof api.step !== 'function') { console.error('[scene ' + id + '] bad contract'); return null; }

    var bar = document.createElement('div');
    bar.className = 'ctlbar';
    var pp = document.createElement('button');
    pp.type = 'button'; pp.className = 'btn pp';
    var rp = document.createElement('button');
    rp.type = 'button'; rp.className = 'btn'; rp.textContent = '重播';
    var tag = document.createElement('span');
    tag.className = 'livebadge'; tag.textContent = 'LIVE';
    bar.appendChild(pp); bar.appendChild(rp); bar.appendChild(tag);
    var own = fig.querySelector('.ctl');
    if (own) bar.appendChild(own);
    var cap = fig.querySelector('figcaption');
    fig.insertBefore(bar, cap);

    window.__api = window.__api || {}; window.__api[id] = api;
    var s = { id: id, api: api, t: 0, playing: !reduce, visible: true, fig: fig, pp: pp };
    function paint() {
      pp.textContent = s.playing ? '暂停' : '播放';
      pp.setAttribute('aria-pressed', s.playing ? 'true' : 'false');
      pp.setAttribute('aria-label', (s.playing ? '暂停' : '播放') + '动画');
      tag.style.opacity = s.playing ? '.9' : '.3';
    }
    pp.addEventListener('click', function () { s.playing = !s.playing; paint(); });
    rp.addEventListener('click', function () {
      s.t = 0;
      try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] reset', e); }
    });
    paint();
    try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] first frame', e); }

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { s.visible = es[0].isIntersecting; },
        { rootMargin: '120px' }).observe(fig);
    }
    return s;
  }

  function boot() {
    var figs = document.querySelectorAll('figure[data-scene]');
    for (var i = 0; i < figs.length; i++) {
      var s = build(figs[i]);
      if (s) live.push(s);
    }
    var g = document.getElementById('gswitch');
    if (g) {
      g.addEventListener('click', function () {
        var anyOn = live.some(function (s) { return s.playing; });
        live.forEach(function (s) { if (s.playing === anyOn) s.pp.click(); });
        g.textContent = anyOn ? '▶ 全部播放' : '⏸ 全部暂停';
      });
      g.textContent = reduce ? '▶ 全部播放' : '⏸ 全部暂停';
    }
    var last = 0;
    function frame(now) {
      var dt = last ? Math.min((now - last) / 1000, 1 / 30) : 0;
      last = now;
      for (var i = 0; i < live.length; i++) {
        var s = live[i];
        if (!s.playing || !s.visible) continue;
        s.t += dt;
        try { s.api.step(s.t); }
        catch (e) { console.error('[scene ' + s.id + '] step', e); s.playing = false; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>
function __runProbe(){
  var out = {ok:false, errors:[], render:[], scenes:[], series:{}, notes:[]};
  function rec(e){ out.errors.push(String(e && e.stack || e)); }
  window.onerror = function(m,s,l,c,e){ rec(m + " @" + l + ":" + c); };
  var _ce = console.error; console.error = function(){ rec([].join.call(arguments," ")); _ce.apply(console, arguments); };
  try {
