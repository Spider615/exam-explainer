<figcaption>斜面倾角30°，ab（m₁=0.8kg，接电阻R=0.02Ω）由静止释放，cd（m₂=0.4kg，接电容C=1F）在恒力F=4.64N作用下由静止开始运动，二者相向滑向M、N处发生弹性碰撞（碰前瞬间F已撤去）。两棒运动时间t1≈1.2s；cd加速度a2=6m/s²、碰前cd速度v2=7.2m/s；ab下滑过程R上焦耳热QR≈0.78J；碰撞后瞬间ab速度≈3.3m/s、cd速度≈8.4m/s，方向均反转。</figcaption></figure>


<script>window.Scenes = {};</script>
<script>window.Scenes["q13-gen2"] = function (fig) {
  var svg = fig.querySelector('svg');
  var abRod = fig.querySelector('#q13-gen2-abRod');
  var cdRod = fig.querySelector('#q13-gen2-cdRod');
  var Farrow = fig.querySelector('#q13-gen2-Farrow');
  var Flabel = fig.querySelector('#q13-gen2-Flabel');
  var Fremoved = fig.querySelector('#q13-gen2-Fremoved');
  var flash = fig.querySelector('#q13-gen2-flash');
  var abPost = fig.querySelector('#q13-gen2-abPost');
  var cdPost = fig.querySelector('#q13-gen2-cdPost');
  var infoPhase = fig.querySelector('#q13-gen2-info-phase');
  var infoV1 = fig.querySelector('#q13-gen2-info-v1');
  var infoA1 = fig.querySelector('#q13-gen2-info-a1');
  var infoV2 = fig.querySelector('#q13-gen2-info-v2');
  var infoA2 = fig.querySelector('#q13-gen2-info-a2');
  var infoT = fig.querySelector('#q13-gen2-info-t');
  var infoQR = fig.querySelector('#q13-gen2-info-QR');
  var QRbar = fig.querySelector('#q13-gen2-QRbar');
  var infoV1post = fig.querySelector('#q13-gen2-info-v1post');
  var infoV2post = fig.querySelector('#q13-gen2-info-v2post');

  // ---- 权威常数（与 spec.constants 完全一致，不得改动力的形式）----
  var B = 0.2, L = 1.0, R = 0.02, r1 = 0.08, C = 1.0;
  var m1 = 0.8, m2 = 0.4, F = 4.64, x0 = 4.32, g = 10.0, sinTheta = 0.5;

  // cd：匀加速直线运动，代数解
  var a2 = (F - m2 * g * sinTheta) / (m2 + B * B * L * L * C);
  var t1 = Math.sqrt(2.0 * x0 / a2);

  // ab：dv1/dt = g*sinθ - k*v1，数值积分（RK4，与 spec.reference 完全一致）
  var k = (B * B * L * L) / (m1 * (R + r1));
  var gSin = g * sinTheta;

  function deriv(v1) {
    var dv1 = gSin - k * v1;
    var dx1 = v1;
    var I1 = B * L * v1 / (R + r1);
    var dQR = R * I1 * I1;
    return [dv1, dx1, dQR];
  }

  function integrate(tTarget) {
    var steps = 2000;
    if (tTarget <= 0.0) return [0.0, 0.0, 0.0];
    var dt = tTarget / steps;
    var v1 = 0.0, x1 = 0.0, QR = 0.0;
    var i, k1, k2, k3, k4;
    for (i = 0; i < steps; i++) {
      k1 = deriv(v1);
      k2 = deriv(v1 + 0.5 * dt * k1[0]);
      k3 = deriv(v1 + 0.5 * dt * k2[0]);
      k4 = deriv(v1 + dt * k3[0]);
      v1 = v1 + (dt / 6.0) * (k1[0] + 2.0 * k2[0] + 2.0 * k3[0] + k4[0]);
      x1 = x1 + (dt / 6.0) * (k1[1] + 2.0 * k2[1] + 2.0 * k3[1] + k4[1]);
      QR = QR + (dt / 6.0) * (k1[2] + 2.0 * k2[2] + 2.0 * k3[2] + k4[2]);
    }
    return [v1, x1, QR];
  }

  // 碰撞时刻（u=1）的状态：只需算一次，供 AB0_D 与碰后速度使用
  var res_t1 = integrate(t1);
  var v1_t1 = res_t1[0], x1_t1 = res_t1[1];
  var v2_t1 = a2 * t1;
  var v1_post = ((m1 - m2) * (-v1_t1) + 2.0 * m2 * v2_t1) / (m1 + m2);
  var v2_post = ((m2 - m1) * v2_t1 + 2.0 * m1 * (-v1_t1)) / (m1 + m2);

  // 纯物理函数：只依据 (u, caseId) 计算，probe 与 step 共用
  function physics(u, caseId) {
    u = Math.max(0, Math.min(1, u));
    var t = u * t1;
    var res = integrate(t);
    var v1 = res[0], x1 = res[1], QR = res[2];
    var a1 = gSin - k * v1;
    var q = B * L * x1 / (R + r1);
    var v2 = a2 * t;
    var x2 = 0.5 * a2 * t * t;
    return {
      u: u, t: t, x1: x1, v1: v1, a1: a1, x2: x2, v2: v2, a2: a2,
      q: q, QR: QR, v1_post: v1_post, v2_post: v2_post
    };
  }

  // ---- 像素布局（纯渲染用，不参与物理计算）----
  var DEG = Math.PI / 180 * 30;
  var dirx = Math.cos(DEG), diry = -Math.sin(DEG);     // 沿导轨向上为正
  var perpx = Math.sin(DEG), perpy = Math.cos(DEG);    // 垂直导轨方向（画双轨间距）
  var SCALE = 22.0;
  var MNx = 230.0, MNy = 190.0;
  var AB0_D = x1_t1;   // ab 释放点到 MN 的沿轨距离（由微分方程数值积分解出，非题面直给）
  var CD0_D = -x0;

  function point(d) {
    return [MNx + d * SCALE * dirx, MNy + d * SCALE * diry];
  }
  function offset(p, kk) {
    return [p[0] + kk * perpx, p[1] + kk * perpy];
  }
  var Mpt = offset(point(0.0), 12);
  var Npt = offset(point(0.0), -12);

  function setLine(el, p1, p2) {
    el.setAttribute('x1', p1[0].toFixed(2));
    el.setAttribute('y1', p1[1].toFixed(2));
    el.setAttribute('x2', p2[0].toFixed(2));
    el.setAttribute('y2', p2[1].toFixed(2));
  }

  function render(u, hold) {
    var s = physics(u, 'c1');
    var collided = u >= 1;

    var abD = AB0_D - s.x1;
    var cdD = CD0_D + s.x2;
    var abC = point(abD);
    var cdC = point(cdD);
    setLine(abRod, offset(abC, 12), offset(abC, -12));
    setLine(cdRod, offset(cdC, 12), offset(cdC, -12));

    if (!collided) {
      var ftip = [cdC[0] + 30 * dirx, cdC[1] + 30 * diry];
      setLine(Farrow, cdC, ftip);
      Flabel.setAttribute('x', (ftip[0] + 4).toFixed(2));
      Flabel.setAttribute('y', (ftip[1] - 4).toFixed(2));
      Farrow.setAttribute('opacity', '1');
      Flabel.setAttribute('opacity', '1');
      Fremoved.setAttribute('opacity', '0');
    } else {
      Farrow.setAttribute('opacity', '0');
      Flabel.setAttribute('opacity', '0');
      Fremoved.setAttribute('opacity', '1');
    }

    if (hold > 0) {
      var hh = Math.min(hold, 1);
      flash.setAttribute('r', (10 + 26 * hh).toFixed(2));
      flash.setAttribute('opacity', (Math.max(0, 1 - hh) * 0.85).toFixed(2));

      var growth = Math.min(hold * 3, 1);
      var abTip = [Mpt[0] + 34 * growth * dirx, Mpt[1] + 34 * growth * diry];
      var cdTip = [Npt[0] - 34 * growth * dirx, Npt[1] - 34 * growth * diry];
      setLine(abPost, Mpt, abTip);
      setLine(cdPost, Npt, cdTip);
      abPost.setAttribute('opacity', '1');
      cdPost.setAttribute('opacity', '1');
    } else {
      flash.setAttribute('r', '0');
      flash.setAttribute('opacity', '0');
      setLine(abPost, Mpt, Mpt);
      setLine(cdPost, Npt, Npt);
      abPost.setAttribute('opacity', '0');
      cdPost.setAttribute('opacity', '0');
    }

    infoPhase.textContent = collided ? '碰撞瞬间！方向反转' : '沿导轨相向运动中';
    infoV1.textContent = 'v1 = ' + s.v1.toFixed(2) + ' m/s';
    infoA1.textContent = 'a1 = ' + s.a1.toFixed(2) + ' m/s²';
    infoV2.textContent = 'v2 = ' + s.v2.toFixed(2) + ' m/s';
    infoA2.textContent = 'a2 = ' + s.a2.toFixed(2) + ' m/s²';
    infoT.textContent = 't=' + s.t.toFixed(2) + 's u=' + s.u.toFixed(2);
    infoQR.textContent = 'QR = ' + s.QR.toFixed(3) + ' J';
    QRbar.setAttribute('width', (140 * Math.min(s.QR / 0.78, 1)).toFixed(2));

    if (collided) {
      infoV1post.setAttribute('opacity', '1');
      infoV2post.setAttribute('opacity', '1');
      infoV1post.textContent = 'v1_post=' + s.v1_post.toFixed(2) + ' m/s';
      infoV2post.textContent = 'v2_post=' + s.v2_post.toFixed(2) + ' m/s';
    } else {
      infoV1post.setAttribute('opacity', '0');
      infoV2post.setAttribute('opacity', '0');
    }
  }

  var ANIM_T = 3.2, HOLD_T = 1.6;
  var CYCLE = ANIM_T + HOLD_T;

  return {
    step: function (t) {
      var cyc = t % CYCLE;
      var u, hold;
      if (cyc <= ANIM_T) { u = cyc / ANIM_T; hold = 0; }
      else { u = 1; hold = (cyc - ANIM_T) / HOLD_T; }
      render(u, hold);
    },
    reset: function () {
      render(0, 0);
    },
    probe: function (u, caseId) {
      return physics(u, caseId);
    }
  };
};
</script>
<script>/* ===== 动画运行时 ===== */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var live = [];

  function build(fig) {
    var id = fig.getAttribute('data-scene');
    var factory = window.Scenes[id];
    if (typeof factory !== 'function') return null;
    var api;
    try { api = factory(fig); } catch (e) { console.error('[scene ' + id + '] setup failed', e); return null; }
    if (!api || typeof api.step !== 'function') { console.error('[scene ' + id + '] bad contract'); return null; }

    var bar = document.createElement('div');
    bar.className = 'ctlbar';
    var pp = document.createElement('button');
    pp.type = 'button'; pp.className = 'btn pp';
    var rp = document.createElement('button');
    rp.type = 'button'; rp.className = 'btn'; rp.textContent = '重播';
    var tag = document.createElement('span');
    tag.className = 'livebadge'; tag.textContent = 'LIVE';
    bar.appendChild(pp); bar.appendChild(rp); bar.appendChild(tag);
    var own = fig.querySelector('.ctl');
    if (own) bar.appendChild(own);
    var cap = fig.querySelector('figcaption');
    fig.insertBefore(bar, cap);

    window.__api = window.__api || {}; window.__api[id] = api;
    var s = { id: id, api: api, t: 0, playing: !reduce, visible: true, fig: fig, pp: pp };
    function paint() {
      pp.textContent = s.playing ? '暂停' : '播放';
      pp.setAttribute('aria-pressed', s.playing ? 'true' : 'false');
      pp.setAttribute('aria-label', (s.playing ? '暂停' : '播放') + '动画');
      tag.style.opacity = s.playing ? '.9' : '.3';
    }
    pp.addEventListener('click', function () { s.playing = !s.playing; paint(); });
    rp.addEventListener('click', function () {
      s.t = 0;
      try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] reset', e); }
    });
    paint();
    try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] first frame', e); }

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { s.visible = es[0].isIntersecting; },
        { rootMargin: '120px' }).observe(fig);
    }
    return s;
  }

  function boot() {
    var figs = document.querySelectorAll('figure[data-scene]');
    for (var i = 0; i < figs.length; i++) {
      var s = build(figs[i]);
      if (s) live.push(s);
    }
    var g = document.getElementById('gswitch');
    if (g) {
      g.addEventListener('click', function () {
        var anyOn = live.some(function (s) { return s.playing; });
        live.forEach(function (s) { if (s.playing === anyOn) s.pp.click(); });
        g.textContent = anyOn ? '▶ 全部播放' : '⏸ 全部暂停';
      });
      g.textContent = reduce ? '▶ 全部播放' : '⏸ 全部暂停';
    }
    var last = 0;
    function frame(now) {
      var dt = last ? Math.min((now - last) / 1000, 1 / 30) : 0;
      last = now;
      for (var i = 0; i < live.length; i++) {
        var s = live[i];
        if (!s.playing || !s.visible) continue;
        s.t += dt;
        try { s.api.step(s.t); }
        catch (e) { console.error('[scene ' + s.id + '] step', e); s.playing = false; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

          everDrawn[idq] = true;
          mm = invM.multiply(mm);                          /* → viewBox 用户单位 */
          var cxq = bb.x + bb.width / 2, cyq = bb.y + bb.height / 2;
          var XQ = mm.a * cxq + mm.c * cyq + mm.e;
          var YQ = mm.b * cxq + mm.d * cyq + mm.f;
          if (XQ >= vb.x - 2 && XQ <= vb.x + vb.width + 2 &&
              YQ >= vb.y - 2 && YQ <= vb.y + vb.height + 2)
            everOK[idq] = true;
        }
      }
      var off = [], dead = [];
      for (var q2 = 0; q2 < ids.length; q2++) {
        if (!everDrawn[ids[q2]]) dead.push(ids[q2]);
        else if (!everOK[ids[q2]]) off.push(ids[q2]);
      }
      if (off.length)
        out.render.push("这些元素在全部 41 个采样时刻都画在 viewBox 之外（画面上看不到）：" + off.join(", "));
      var moved = false;
      for (var q3 = 1; q3 < snaps.length; q3++) if (snaps[q3] !== snaps[0]) { moved = true; break; }
      if (!moved)
        out.render.push("采样了 " + snaps.length + " 个不同时刻，SVG 内容完全没有变化——动画没有动");
      out.notes.push("渲染覆盖：" + ids.length + " 个带 id 元素，" +
                     Object.keys(everOK).length + " 个曾正常出现在画面内" +
                     (dead.length ? "，" + dead.length + " 个全程无几何(" + dead.slice(0, 6).join(",") + ")" : ""));
    } catch (errR) { out.render.push("渲染覆盖检查自身失败: " + errR); }

    // --- probe 采样 ---
    var N = SPEC.sample_points || 401;
    for (var ci = 0; ci < SPEC.cases.length; ci++) {
      var cid = SPEC.cases[ci].id;
      var cols = {}; SPEC.probe_keys.forEach(function(k){ cols[k] = []; });

      // 纯度 + 无副作用
      var before = svg.outerHTML;
      var a1 = api.probe(0.37, cid), a2 = api.probe(0.37, cid);
      if (svg.outerHTML !== before) out.errors.push("[" + cid + "] probe() 修改了 DOM（必须是纯函数）");
      SPEC.probe_keys.forEach(function(k){
        if (!(k in a1)) out.errors.push("[" + cid + "] probe 返回值缺少键 " + k);
        else if (a1[k] !== a2[k]) out.errors.push("[" + cid + "] probe 不纯：同一 u 两次调用 " + k + " 不同（" + a1[k] + " vs " + a2[k] + "）");
      });

      var nbad = 0;
      for (var i = 0; i < N; i++) {
        var u = i / (N - 1);
        var r;
        try { r = api.probe(u, cid); }
        catch (e) { out.errors.push("[" + cid + "] probe(" + u.toFixed(3) + ") 抛异常: " + e); break; }
        for (var ki = 0; ki < SPEC.probe_keys.length; ki++) {
          var k = SPEC.probe_keys[ki], v = r ? r[k] : undefined;
          if (typeof v !== "number" || !isFinite(v)) { nbad++; v = null; }
          cols[k].push(v);
        }
      }
      if (nbad) out.errors.push("[" + cid + "] probe 返回了 " + nbad + " 个非有限数值");
      out.series[cid] = cols;
    }
    out.ok = out.errors.length === 0 && out.render.length === 0;
  } catch (e) { if (e) rec(e); }
  document.getElementById("TESTOUT").textContent = "@@" + JSON.stringify(out) + "@@";
}
/* 必须等运行时 boot 完（它也挂在 DOMContentLoaded 上，且注册在前），
   同时保证 <pre id="TESTOUT"> 已经存在 */
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", __runProbe);
else __runProbe();
</script>
<pre id="TESTOUT"></pre>
