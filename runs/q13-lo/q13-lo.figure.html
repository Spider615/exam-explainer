  <g id="q13-lo-panel">
<rect class="sh" x="415.7" y="10.0" width="132.3" height="70.4" rx="2" fill="var(--panel)"/>
  <text class="u" x="421.7" y="26.9">自释放时刻起</text>
  <text class="n" id="q13-lo-ro-t" x="542.0" y="26.9" text-anchor="end">–</text>

  <text class="n" id="q13-lo-ro-v1" x="542.0" y="41.5" text-anchor="end">–</text>

  <text class="n" id="q13-lo-ro-a1" x="542.0" y="56.1" text-anchor="end">–</text>

  <text class="n" id="q13-lo-ro-v2" x="542.0" y="70.8" text-anchor="end">–</text>
</g>
</svg>
<figcaption>斜面双导体棒电磁感应（ab接电阻、cd接电容）与弹性碰撞。两棒运动时间t1≈1.2s。cd加速度a2=6m/s²、碰前cd速度v2=7.2m/s。R上焦耳热QR≈0.78J。碰撞后瞬间ab速度≈3.3m/s、cd速度≈8.4m/s。</figcaption></figure>
