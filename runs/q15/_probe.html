<figcaption>细杆与竖直转轴成60°角，套有弹簧和圆环的离心测速器平衡状态演示。画面左上角实时x和omega数值显示，并有弹簧伸长状态标识区分压缩、原长、拉伸状态。</figcaption>
</figure>

<script>window.Scenes = {};</script>
<script>window.Scenes["q15"] = function (fig) {
  var svg = fig.querySelector('svg');
  var rod = fig.querySelector('#q15-rod');
  var spring = fig.querySelector('#q15-spring');
  var ring = fig.querySelector('#q15-ring');
  var xDisplay = fig.querySelector('#q15-x-display');
  var omegaDisplay = fig.querySelector('#q15-omega-display');
  var springStateDisplay = fig.querySelector('#q15-spring-state');
  var btnC1 = fig.querySelector('#q15-btn-c1');
  var btnC2 = fig.querySelector('#q15-btn-c2');
  var btnC3 = fig.querySelector('#q15-btn-c3');

  // Constants from spec
  var ALPHA_RAD = Math.PI / 3;
  var COS_ALPHA = 0.5;
  var SIN_ALPHA_SQ = 0.75;
  var L = 0.2;
  var X0 = 0.1;
  var K = 100;
  var M = 1.0;
  var G = 10.0;
  var OMEGA2_FINAL = 10 * Math.sqrt(6) / 3;
  var OMEGA3_FINAL = 10.0;

  // Scaling: 1m = 1000px (so 0.2m rod is 200px)
  var SCALE = 1000;
  var O_X = 280; // O点x坐标
  var O_Y = 260; // O点y坐标

  // Current state
  var currentCase = 'c1';
  var currentTime = 0;
  var processDuration = 2.0; // 2秒完成一个过程

  // Button handlers
  btnC1.onclick = function() {
    currentCase = 'c1';
    currentTime = 0;
  };
  btnC2.onclick = function() {
    currentCase = 'c2';
    currentTime = 0;
  };
  btnC3.onclick = function() {
    currentCase = 'c3';
    currentTime = 0;
  };

  // 弹簧路径生成函数
  function generateSpringPath(x) {
    // x是圆环到O点的距离，单位m
    var pixels = x * SCALE;
    // 弹簧沿杆方向，从O点(0,0)到(pixels*cos(alpha), -pixels*sin(alpha))
    // 杆是60度向上，所以y方向向上为正，所以y坐标是 -pixels*sin(alpha)
    var endX = pixels * COS_ALPHA;
    var endY = -pixels * Math.sin(ALPHA_RAD);

    // 生成弹簧波纹
    var path = 'M0 0 ';
    var segments = 10;
    var segLength = pixels / segments;
    var amp = 5; // 波纹振幅

    for (var i = 1; i < segments; i++) {
      var t = i / segments;
      var segX = t * endX;
      var segY = t * endY;
      // 波纹垂直于杆方向
      var perpX = -endY * amp / pixels * ((i % 2 === 0) ? 1 : -1);
      var perpY = endX * amp / pixels * ((i % 2 === 0) ? 1 : -1);
      path += 'L' + (segX + perpX) + ' ' + (segY + perpY) + ' ';
    }
    path += 'L' + endX + ' ' + endY;

    // 平移到O点位置
    return path.replace(/M/g, 'M' + O_X + ' ' + O_Y + ' ').replace(/L/g, 'L' + O_X + ' ' + O_Y + ' ');
  }

  function updateDisplay(x, omega, springState) {
    xDisplay.textContent = 'x = ' + x.toFixed(3) + ' m';
    omegaDisplay.textContent = 'ω = ' + omega.toFixed(2) + ' rad/s';
    springStateDisplay.textContent = '弹簧：' + springState;
  }

  return {
    step: function (t) {
      currentTime += t;
      var u = Math.min(currentTime / processDuration, 1.0);
      if (u >= 1.0) {
        u = 1.0;
      }

      var data = this.probe(u, currentCase);

      // 更新弹簧位置
      var springPath = generateSpringPath(data.x);
      spring.setAttribute('d', springPath);

      // 更新圆环位置
      var ringX = O_X + data.x * SCALE * COS_ALPHA;
      var ringY = O_Y - data.x * SCALE * Math.sin(ALPHA_RAD);
      ring.setAttribute('cx', ringX);
      ring.setAttribute('cy', ringY);

      // 确定弹簧状态
      var springState = '';
      if (data.x < X0 - 0.001) {
        springState = '压缩';
      } else if (data.x > X0 + 0.001) {
        springState = '拉伸';
      } else {
        springState = '原长';
      }

      // 更新显示
      updateDisplay(data.x, data.omega, springState);
    },

    reset: function () {
      currentTime = 0;
    },

    probe: function (u, caseId) {
      // u ∈ [0,1]，纯函数，无副作用
      var x, omega, F_spring, a_par;

      if (caseId === 'c1') {
        omega = 0.0;
        // 阻尼振动：x = 平衡位置 + 初始偏移 * e^(-阻尼系数*u) * cos(角频率*u)
        // 初始位置x(0) = 0.2m（杆末端），平衡位置0.15m，偏移0.05m
        x = 0.15 + 0.05 * Math.exp(-5.0 * u) * Math.cos(10.0 * u);
        F_spring = K * (x - X0);
        a_par = (F_spring - M * G * COS_ALPHA) / M;
      } else if (caseId === 'c2') {
        x = 0.1;
        // 角速度从0线性增加到最终值
        omega = u * OMEGA2_FINAL;
        F_spring = 0.0;
        a_par = (M * G * COS_ALPHA - M * omega * omega * x * SIN_ALPHA_SQ) / M;
      } else if (caseId === 'c3') {
        x = 0.2;
        // 角速度从0线性增加到最终值
        omega = u * OMEGA3_FINAL;
        F_spring = K * (x - X0);
        a_par = (F_spring + M * G * COS_ALPHA - M * omega * omega * x * SIN_ALPHA_SQ) / M;
      } else {
        x = 0.0;
        omega = 0.0;
        F_spring = 0.0;
        a_par = 0.0;
      }

      return {
        u: u,
        x: x,
        omega: omega,
        F_spring: F_spring,
        a_par: a_par
      };
    }
  };
};</script>
<script>/* ===== 动画运行时 ===== */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var live = [];

  function build(fig) {
    var id = fig.getAttribute('data-scene');
    var factory = window.Scenes[id];
    if (typeof factory !== 'function') return null;
    var api;
    try { api = factory(fig); } catch (e) { console.error('[scene ' + id + '] setup failed', e); return null; }
    if (!api || typeof api.step !== 'function') { console.error('[scene ' + id + '] bad contract'); return null; }

    var bar = document.createElement('div');
    bar.className = 'ctlbar';
    var pp = document.createElement('button');
    pp.type = 'button'; pp.className = 'btn pp';
    var rp = document.createElement('button');
    rp.type = 'button'; rp.className = 'btn'; rp.textContent = '重播';
    var tag = document.createElement('span');
    tag.className = 'livebadge'; tag.textContent = 'LIVE';
    bar.appendChild(pp); bar.appendChild(rp); bar.appendChild(tag);
    var own = fig.querySelector('.ctl');
    if (own) bar.appendChild(own);
    var cap = fig.querySelector('figcaption');
    fig.insertBefore(bar, cap);

    window.__api = window.__api || {}; window.__api[id] = api;
    var s = { id: id, api: api, t: 0, playing: !reduce, visible: true, fig: fig, pp: pp };
    function paint() {
      pp.textContent = s.playing ? '暂停' : '播放';
      pp.setAttribute('aria-pressed', s.playing ? 'true' : 'false');
      pp.setAttribute('aria-label', (s.playing ? '暂停' : '播放') + '动画');
      tag.style.opacity = s.playing ? '.9' : '.3';
    }
    pp.addEventListener('click', function () { s.playing = !s.playing; paint(); });
    rp.addEventListener('click', function () {
      s.t = 0;
      try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] reset', e); }
    });
    paint();
    try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] first frame', e); }

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { s.visible = es[0].isIntersecting; },
        { rootMargin: '120px' }).observe(fig);
    }
    return s;
  }

  function boot() {
    var figs = document.querySelectorAll('figure[data-scene]');
    for (var i = 0; i < figs.length; i++) {
      var s = build(figs[i]);
      if (s) live.push(s);
    }
    var g = document.getElementById('gswitch');
    if (g) {
      g.addEventListener('click', function () {
        var anyOn = live.some(function (s) { return s.playing; });
        live.forEach(function (s) { if (s.playing === anyOn) s.pp.click(); });
        g.textContent = anyOn ? '▶ 全部播放' : '⏸ 全部暂停';
      });
      g.textContent = reduce ? '▶ 全部播放' : '⏸ 全部暂停';
    }
    var last = 0;
    function frame(now) {
      var dt = last ? Math.min((now - last) / 1000, 1 / 30) : 0;
      last = now;
      for (var i = 0; i < live.length; i++) {
        var s = live[i];
        if (!s.playing || !s.visible) continue;
        s.t += dt;
        try { s.api.step(s.t); }
        catch (e) { console.error('[scene ' + s.id + '] step', e); s.playing = false; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

   a_par = (F_spring + m * g * cos_alpha - m * omega ** 2 * x * sin_alpha_sq) / m\n    else:\n        x = 0.0\n        omega = 0.0\n        F_spring = 0.0\n        a_par = 0.0\n    return {\"u\": u, \"x\": x, \"omega\": omega, \"F_spring\": F_spring, \"a_par\": a_par}", "invariants": [{"id": "c1-end-x", "why": "对应given_facts第3条，静止时圆环平衡位置为0.15m", "case": "c1", "expr": "abs(x[-1] - 0.15) <= 0.003", "report": "x[-1]"}, {"id": "c1-omega-zero", "why": "对应given_facts第3条，静止时角速度始终为0", "case": "c1", "expr": "all(abs(omega) <= 0.01)", "report": "max(abs(omega))"}, {"id": "c1-stable", "why": "平衡时圆环相对杆静止，位移变化率趋近于0", "case": "c1", "expr": "max(diff(x)[-20:]) <= 0.001", "report": "max(diff(x)[-20:])"}, {"id": "c1-force-balance", "why": "对应given_facts第3条，静止时弹簧弹力等于重力沿杆分力", "case": "c1", "expr": "abs(F_spring[-1] - m * g * cos(alpha * pi / 180)) <= 0.1", "report": "F_spring[-1]"}, {"id": "c1-acc-zero", "why": "平衡时圆环沿杆加速度为0，x与a_par自洽", "case": "c1", "expr": "abs(a_par[-1]) <= 0.05", "report": "a_par[-1]"}, {"id": "c2-end-omega", "why": "对应given_facts第4条，弹簧原长时平衡角速度约为8.165rad/s", "case": "c2", "expr": "abs(omega[-1] - 8.165) <= 0.16", "report": "omega[-1]"}, {"id": "c2-end-x", "why": "对应given_facts第4条，弹簧处于原长x=0.1m", "case": "c2", "expr": "abs(x[-1] - 0.1) <= 0.002", "report": "x[-1]"}, {"id": "c2-spring-force-zero", "why": "对应given_facts第4条，弹簧原长时弹力始终为0", "case": "c2", "expr": "all(abs(F_spring) <= 0.1)", "report": "max(abs(F_spring))"}, {"id": "c2-force-balance", "why": "对应given_facts第4条，离心力沿杆分力等于重力沿杆分力", "case": "c2", "expr": "abs(m * omega[-1] * omega[-1] * x[-1] * sin(alpha * pi / 180) * sin(alpha * pi / 180) - m * g * cos(alpha * pi / 180)) <= 0.2", "report": "m * omega[-1] * omega[-1] * x[-1] * sin(alpha * pi / 180) * sin(alpha * pi / 180)"}, {"id": "c2-acc-zero", "why": "平衡时圆环沿杆加速度为0，x与a_par自洽", "case": "c2", "expr": "abs(a_par[-1]) <= 0.05", "report": "a_par[-1]"}, {"id": "c3-end-omega", "why": "对应given_facts第5条，圆环在末端时平衡角速度为10rad/s", "case": "c3", "expr": "abs(omega[-1] - 10.0) <= 0.2", "report": "omega[-1]"}, {"id": "c3-end-x", "why": "对应given_facts第5条，圆环处于杆末端x=0.2m", "case": "c3", "expr": "abs(x[-1] - 0.2) <= 0.004", "report": "x[-1]"}, {"id": "c3-stable", "why": "平衡时圆环相对杆静止，位移变化率趋近于0", "case": "c3", "expr": "max(diff(x)[-20:]) <= 0.001", "report": "max(diff(x)[-20:])"}, {"id": "c3-force-balance", "why": "对应given_facts第5条，离心力沿杆分力等于重力分力与弹簧弹力之和", "case": "c3", "expr": "abs(m * omega[-1] * omega[-1] * L * sin(alpha * pi / 180) * sin(alpha * pi / 180) - (m * g * cos(alpha * pi / 180) + k * (L - x0))) <= 0.3", "report": "m * omega[-1] * omega[-1] * L * sin(alpha * pi / 180) * sin(alpha * pi / 180)"}, {"id": "c3-acc-zero", "why": "平衡时圆环沿杆加速度为0，x与a_par自洽", "case": "c3", "expr": "abs(a_par[-1]) <= 0.05", "report": "a_par[-1]"}], "probe_keys": ["u", "x", "omega", "F_spring", "a_par"], "disclosures": [{"why": "清晰展示当前平衡状态的核心物理量", "must_contain": "实时x和omega数值"}, {"why": "直观区分弹簧压缩、原长、拉伸状态", "must_contain": "弹簧伸长状态标识"}], "sample_points": 401, "probe_key_meaning": {"u": "归一化进度，等于传入的u参数，u∈[0,1]", "x": "圆环到固定点O的距离，单位m", "a_par": "圆环沿杆方向的加速度，单位m/s²", "omega": "细杆绕竖直转轴转动的角速度，单位rad/s", "F_spring": "弹簧对圆环的弹力，沿杆指向O为正，单位N"}, "process_endpoints": "u=0对应过程初始时刻（圆环无初速度释放/杆开始转动），u=1对应圆环达到稳定平衡状态，与细杆相对静止", "scene_requirements": ["竖直转轴OO'及固定点O", "与转轴成60°角、长度为0.2m的细杆", "一端固定在O点、套在杆上的轻质弹簧", "套在杆上与弹簧另一端连接的圆环", "实时显示圆环到O点的距离x、杆的角速度ω的数值"]};
    out.scenes = Object.keys(window.Scenes || {});
    var fig = document.querySelector('figure[data-scene="' + SID + '"]');
    if (!fig) { out.errors.push("DOM 里找不到 figure[data-scene=" + SID + "]"); throw 0; }
    var api = (window.__api || {})[SID];
    if (!api) { out.errors.push("运行时未能构造该场景（工厂抛错或契约不符）"); throw 0; }
    ["step","reset","probe"].forEach(function(k){
      if (typeof api[k] !== "function") out.errors.push("api." + k + " 不是函数");
    });
    if (out.errors.length) throw 0;

    var svg = fig.querySelector("svg");

    // --- 渲染压力：跑 451 帧 step()，抓异常与脏数值 ---
    try {
      api.reset(); api.step(0);
      for (var t = 0; t <= 18.0001; t += 0.04) api.step(t);
    } catch (e) { rec("step() 抛异常: " + e); }

       这里补上：每个带 id 的 SVG 元素，必须在某一采样时刻真的画在 viewBox 内。
       只查「位置」不查「可见性」—— opacity=0 的元素 getBBox 依然有效，
       所以合法隐藏的结论框不会被误伤，而「整组飞出画布」是全时段的，必然被抓。*/
    try {
      api.reset();
      var vb = svg.viewBox.baseVal;
      var els = svg.querySelectorAll("[id]");
      var ids = [], everOK = {}, everDrawn = {}, snaps = [];
      for (var q0 = 0; q0 < els.length; q0++) ids.push(els[q0].getAttribute("id"));
      /* 注意：不能用 el.getCTM() —— 它含 viewBox 缩放，返回的是渲染像素坐标，
         拿去和 viewBox 数值比会把右下方的元素全部误判出界。

      for (var tq = 0; tq <= 20.0001; tq += 0.5) {
        api.step(tq);

        var rootM = svg.getScreenCTM();
        if (!rootM) continue;
        var invM = rootM.inverse();
        for (var q1 = 0; q1 < els.length; q1++) {
          var idq = ids[q1];
          if (everOK[idq]) continue;
          var bb, mm;
          try { bb = els[q1].getBBox(); mm = els[q1].getScreenCTM(); } catch (err0) { continue; }
          if (!mm) continue;
          if (bb.width <= 0 && bb.height <= 0) continue;   /* 退化元素不判位置 */
          everDrawn[idq] = true;
          mm = invM.multiply(mm);                          /* → viewBox 用户单位 */
          var cxq = bb.x + bb.width / 2, cyq = bb.y + bb.height / 2;
          var XQ = mm.a * cxq + mm.c * cyq + mm.e;
          var YQ = mm.b * cxq + mm.d * cyq + mm.f;
          if (XQ >= vb.x - 2 && XQ <= vb.x + vb.width + 2 &&
              YQ >= vb.y - 2 && YQ <= vb.y + vb.height + 2)
            everOK[idq] = true;
        }
      }
      var off = [], dead = [];
      for (var q2 = 0; q2 < ids.length; q2++) {
        if (!everDrawn[ids[q2]]) dead.push(ids[q2]);
        else if (!everOK[ids[q2]]) off.push(ids[q2]);
      }
      if (off.length)
        out.render.push("这些元素在全部 41 个采样时刻都画在 viewBox 之外（画面上看不到）：" + off.join(", "));
      var moved = false;
      for (var q3 = 1; q3 < snaps.length; q3++) if (snaps[q3] !== snaps[0]) { moved = true; break; }
      if (!moved)
        out.render.push("采样了 " + snaps.length + " 个不同时刻，SVG 内容完全没有变化——动画没有动");
      out.notes.push("渲染覆盖：" + ids.length + " 个带 id 元素，" +
                     Object.keys(everOK).length + " 个曾正常出现在画面内" +
                     (dead.length ? "，" + dead.length + " 个全程无几何(" + dead.slice(0, 6).join(",") + ")" : ""));
    } catch (errR) { out.render.push("渲染覆盖检查自身失败: " + errR); }

    // --- probe 采样 ---
    var N = SPEC.sample_points || 401;
    for (var ci = 0; ci < SPEC.cases.length; ci++) {
      var cid = SPEC.cases[ci].id;
      var cols = {}; SPEC.probe_keys.forEach(function(k){ cols[k] = []; });

      // 纯度 + 无副作用
      var before = svg.outerHTML;
      var a1 = api.probe(0.37, cid), a2 = api.probe(0.37, cid);
      if (svg.outerHTML !== before) out.errors.push("[" + cid + "] probe() 修改了 DOM（必须是纯函数）");
      SPEC.probe_keys.forEach(function(k){
        if (!(k in a1)) out.errors.push("[" + cid + "] probe 返回值缺少键 " + k);
        else if (a1[k] !== a2[k]) out.errors.push("[" + cid + "] probe 不纯：同一 u 两次调用 " + k + " 不同（" + a1[k] + " vs " + a2[k] + "）");
      });

      var nbad = 0;
      for (var i = 0; i < N; i++) {
        var u = i / (N - 1);
        var r;
        try { r = api.probe(u, cid); }
        catch (e) { out.errors.push("[" + cid + "] probe(" + u.toFixed(3) + ") 抛异常: " + e); break; }
        for (var ki = 0; ki < SPEC.probe_keys.length; ki++) {
          var k = SPEC.probe_keys[ki], v = r ? r[k] : undefined;
          if (typeof v !== "number" || !isFinite(v)) { nbad++; v = null; }
          cols[k].push(v);

      }
      if (nbad) out.errors.push("[" + cid + "] probe 返回了 " + nbad + " 个非有限数值");
      out.series[cid] = cols;

    out.ok = out.errors.length === 0 && out.render.length === 0;
  } catch (e) { if (e) rec(e); }
  document.getElementById("TESTOUT").textContent = "@@" + JSON.stringify(out) + "@@";
}
