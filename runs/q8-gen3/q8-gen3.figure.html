<figcaption>自设参数：t_E=10s、t_F=20s、t_M=40s、t_N=53s、m=2kg（由EF、MN两直线方程及FM段连续性反推的近似分段时刻）。FM段(20≤t≤40)速度未给出具体函数，题面只要求端点连续（v(F)=4、v(M)=−2）且单调递减；本实现取v(s)=4−0.51s+0.0105s²（s=t−20）——该二次函数不仅满足端点与单调性，其对时间的积分还恰好使位移Δy=6m，令FM终点高度y=60m与MN直线在t=40s处的高度y=−2×40+140=60m完全衔接，因此y-t曲线在M点连续、无跳变；对应加速度a(t)=−0.51+0.021s恒为负（失重），从F点+4m/s连续单调减至M点−2m/s。FN段动量变化量为|2×(−2)−2×4|=12kg·m/s，并非选项C所称的4kg·m/s；MN段a=0但螺旋桨仍需克服空气阻力做负功，机械能并不守恒。</figcaption></figure>
