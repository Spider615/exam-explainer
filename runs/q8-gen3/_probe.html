<script>window.Scenes = {};</script>
<script>/* q8-gen3 · 无人机竖直飞行 y-t 图像：EF匀速上升、FM失重过渡、MN匀速下降
 *
 * 自设（自洽求解）参数：t_E=10s, t_F=20s, t_M=40s, t_N=53s, m=2kg。
 * EF: y=4t-26（给定），MN: y=-2t+140（给定）。
 * FM段(20<=t<=40)速度题面未给具体函数，只要求 v(F)=4、v(M)=-2 且连续单调递减；
 * 本实现取 v(s)=4-0.51*s+0.0105*s^2（s=t-20），该函数满足端点与单调性，
 * 且其对 s 的积分恰为 6m，使 FM 终点高度与 MN 直线在 t=40s 处的高度（60m）严格衔接，
 * 因此 y、v 在 F、M 两点都连续，只有加速度在 F、M 处发生跳变（符合“加速度突变”的常见物理设定）。
 */
window.Scenes["q8-gen3"] = function (fig) {
  var svg = fig.querySelector('svg');

  /* ---------------- 物理常量 ---------------- */
  var T_E = 10.0, T_F = 20.0, T_M = 40.0, T_N = 53.0;
  var MASS = 2.0;
  var A1 = 0.51, B1 = 0.0105;

  function yOf(t) {
    if (t <= T_F) {
      return 4.0 * t - 26.0;
    } else if (t <= T_M) {
      var s = t - T_F;
      return 54.0 + 4.0 * s - 0.255 * s * s + 0.0035 * s * s * s;
    } else {
      return -2.0 * t + 140.0;
    }
  }
  function vOf(t) {
    if (t <= T_F) {
      return 4.0;
    } else if (t <= T_M) {
      var s = t - T_F;
      return 4.0 - A1 * s + B1 * s * s;
    } else {
      return -2.0;
    }
  }
  function aOf(t) {
    if (t <= T_F) {
      return 0.0;
    } else if (t <= T_M) {
      var s = t - T_F;
      return -A1 + 2.0 * B1 * s;
    } else {
      return 0.0;
    }
  }

  /* ================= 纯物理内核：只依据 u 计算，不碰 DOM ================= */
  function sampleAt(u) {
    var uu = u;
    if (!(uu >= 0)) { uu = 0; }
    if (uu > 1) { uu = 1; }
    var t = T_E + uu * (T_N - T_E);
    var y = yOf(t);
    var v = vOf(t);
    var a = aOf(t);
    var p = MASS * v;
    return { u: uu, t: t, y: y, v: v, a: a, p: p };
  }

  /* ---------------- 屏幕坐标映射（与 figure.html 中静态曲线所用参数一致） ---------------- */
  var TDOM0 = 8.0, TDOM1 = 55.0;
  var GX0 = 54.0, GX1 = 300.0;
  var KX = (GX1 - GX0) / (TDOM1 - TDOM0);
  function gx(t) { return GX0 + (t - TDOM0) * KX; }

  var GY_BOTTOM = 250.0, GY_TOP = 54.0, YDOM1 = 80.0;
  var KY = (GY_BOTTOM - GY_TOP) / YDOM1;
  function gy(val) { return GY_BOTTOM - val * KY; }

  var CX0 = 345.0, CX1 = 540.0;
  var KXc = (CX1 - CX0) / (TDOM1 - TDOM0);
  function chx(t) { return CX0 + (t - TDOM0) * KXc; }

  var CY_TOP = 165.0, CY_BOT = 230.0, VDOM0 = -3.0, VDOM1 = 5.0;
  var KYc = (CY_BOT - CY_TOP) / (VDOM1 - VDOM0);
  function chy(v) { return CY_BOT - (v - VDOM0) * KYc; }

  var VSCALE = 6.0;

  /* ---------------- DOM 引用 ---------------- */
  var elDrone = svg.querySelector('#q8-gen3-drone');
  var elVarrow = svg.querySelector('#q8-gen3-varrow');
  var elCursor = svg.querySelector('#q8-gen3-cursor');
  var elRoT = svg.querySelector('#q8-gen3-ro-t');
  var elRoY = svg.querySelector('#q8-gen3-ro-y');
  var elRoV = svg.querySelector('#q8-gen3-ro-v');
  var elRoA = svg.querySelector('#q8-gen3-ro-a');
  var elRoP = svg.querySelector('#q8-gen3-ro-p');
  var elStatus = svg.querySelector('#q8-gen3-status');
  var elVdot = svg.querySelector('#q8-gen3-vdot');
  var elVcursor = svg.querySelector('#q8-gen3-vcursor');

  /* ---------------- 每帧渲染：与 probe 共用 sampleAt ---------------- */
  function render(u) {
    var s = sampleAt(u);
    var px = gx(s.t), py = gy(s.y);

    elDrone.setAttribute('transform', 'translate(' + px.toFixed(2) + ',' + py.toFixed(2) + ')');

    elVarrow.setAttribute('x1', px.toFixed(2));
    elVarrow.setAttribute('y1', py.toFixed(2));
    elVarrow.setAttribute('x2', px.toFixed(2));
    elVarrow.setAttribute('y2', (py - s.v * VSCALE).toFixed(2));
    elVarrow.setAttribute('class', s.v >= 0 ? 'sa' : 'sr');

    elCursor.setAttribute('x1', px.toFixed(2));
    elCursor.setAttribute('x2', px.toFixed(2));

    elRoT.textContent = s.t.toFixed(2);
    elRoY.textContent = s.y.toFixed(2);
    elRoV.textContent = s.v.toFixed(2);
    elRoA.textContent = s.a.toFixed(2);
    elRoP.textContent = s.p.toFixed(2);

    if (s.t <= T_F + 1e-9) {
      elStatus.textContent = '当前：EF段（匀速上升，a=0）';
      elStatus.setAttribute('class', 'u a');
    } else if (s.t <= T_M + 1e-9) {
      elStatus.textContent = '当前：FM段（失重状态，a<0）';
      elStatus.setAttribute('class', 'u r');
    } else {
      elStatus.textContent = '当前：MN段（匀速下降，a=0）';
      elStatus.setAttribute('class', 'u c');
    }

    var cx = chx(s.t), cy = chy(s.v);
    elVdot.setAttribute('cx', cx.toFixed(2));
    elVdot.setAttribute('cy', cy.toFixed(2));
    elVcursor.setAttribute('x1', cx.toFixed(2));
    elVcursor.setAttribute('x2', cx.toFixed(2));
  }

  /* ---------------- 播放节奏：u 从 0 匀速播到 1，定格后循环 ---------------- */
  var ANIM_T = 6.0, T_HOLD = 1.4;
  var CYC = ANIM_T + T_HOLD;

  function step(t) {
    if (!(t >= 0)) { t = 0; }
    var tt = t - Math.floor(t / CYC) * CYC;
    var u;
    if (tt < ANIM_T) {
      u = tt / ANIM_T;
    } else {
      u = 1;
    }
    render(u);
  }

  function reset() {
    render(0);
  }

  reset();

  return {
    step: step,
    reset: reset,
    probe: function (u, caseId) {
      var s = sampleAt(u);
      return {
        u: s.u,
        t: s.t,
        y: s.y,
        v: s.v,
        a: s.a,
        p: s.p
      };
    }
  };
};
</script>
<script>/* ===== 动画运行时 ===== */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var live = [];

  function build(fig) {
    var id = fig.getAttribute('data-scene');
    var factory = window.Scenes[id];
    if (typeof factory !== 'function') return null;
    var api;
    try { api = factory(fig); } catch (e) { console.error('[scene ' + id + '] setup failed', e); return null; }
    if (!api || typeof api.step !== 'function') { console.error('[scene ' + id + '] bad contract'); return null; }

    var bar = document.createElement('div');
    bar.className = 'ctlbar';
    var pp = document.createElement('button');
    pp.type = 'button'; pp.className = 'btn pp';
    var rp = document.createElement('button');
    rp.type = 'button'; rp.className = 'btn'; rp.textContent = '重播';
    var tag = document.createElement('span');
    tag.className = 'livebadge'; tag.textContent = 'LIVE';
    bar.appendChild(pp); bar.appendChild(rp); bar.appendChild(tag);
    var own = fig.querySelector('.ctl');
    if (own) bar.appendChild(own);
    var cap = fig.querySelector('figcaption');
    fig.insertBefore(bar, cap);

    window.__api = window.__api || {}; window.__api[id] = api;
    var s = { id: id, api: api, t: 0, playing: !reduce, visible: true, fig: fig, pp: pp };
    function paint() {
      pp.textContent = s.playing ? '暂停' : '播放';
      pp.setAttribute('aria-pressed', s.playing ? 'true' : 'false');
      pp.setAttribute('aria-label', (s.playing ? '暂停' : '播放') + '动画');
      tag.style.opacity = s.playing ? '.9' : '.3';
    }
    pp.addEventListener('click', function () { s.playing = !s.playing; paint(); });
    rp.addEventListener('click', function () {
      s.t = 0;
      try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] reset', e); }
    });
    paint();
    try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] first frame', e); }

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { s.visible = es[0].isIntersecting; },
        { rootMargin: '120px' }).observe(fig);
    }
    return s;
  }

  function boot() {
    var figs = document.querySelectorAll('figure[data-scene]');
    for (var i = 0; i < figs.length; i++) {
      var s = build(figs[i]);

of_t(t):\n        if t <= t_F:\n            return 4.0\n        elif t <= t_M:\n            return 4.0 - 0.3 * (t - t_F)\n        else:\n            return -2.0\n\n    t = t_E + u * (t_N - t_E)\n\n    y = y_of_t(t)\n    v = v_of_t(t)\n    p = m * v\n\n    h = 1e-4\n    t_minus = t - h\n    t_plus = t + h\n    if t_minus < t_E:\n        t_minus = t_E\n    if t_plus > t_N:\n        t_plus = t_N\n\n    if t_plus > t_minus:\n        a = (v_of_t(t_plus) - v_of_t(t_minus)) / (t_plus - t_minus)\n    else:\n        a = 0.0\n\n    return {\n        \"u\": u,\n        \"t\": t,\n        \"y\": y,\n        \"v\": v,\n        \"a\": a,\n        \"p\": p\n    }", "invariants": [{"id": "c1-ef-speed", "why": "F1 · EF段速度恒为4 m/s", "case": "c1", "expr": "abs(mean(v[(t>=10.5) & (t<=19.5)]) - 4.0) <= 0.08", "report": "mean(v) in EF segment"}, {"id": "c1-mn-speed", "why": "F2 · MN段速度恒为2 m/s（向下）", "case": "c1", "expr": "abs(mean(v[(t>=40.5) & (t<=52.5)]) - (-2.0)) <= 0.08", "report": "mean(v) in MN segment"}, {"id": "c1-ef-monotonic", "why": "F1 · EF段为匀速直线运动，高度单调上升", "case": "c1", "expr": "max(diff(y[(t>=10) & (t<=20)])) > 0 and max(abs(diff(v[(t>=10) & (t<=20)]))) <= 0.05", "report": "y increasing and v constant in EF"}, {"id": "c1-fm-monotonic-decrease", "why": "F3 · FM段速度从+4连续单调减小到-2，说明加速度恒为负（失重）", "case": "c1", "expr": "max(diff(v[(t>=20) & (t<=40)])) <= 1e-6", "report": "diff(v) in FM segment (should be <=0)"}, {"id": "c1-fm-acceleration-negative", "why": "F5 · FM段加速度方向向下（失重状态）", "case": "c1", "expr": "max(a[(t>=21) & (t<=39)]) <= -0.05", "report": "max(a) in FM segment interior"}, {"id": "c1-mn-acceleration-zero", "why": "F5 · MN段加速度为0", "case": "c1", "expr": "abs(mean(a[(t>=41) & (t<=52)])) <= 0.1", "report": "mean(a) in MN segment"}, {"id": "c1-f-point-velocity", "why": "F3 · F点速度为+4 m/s", "case": "c1", "expr": "abs(interp(20, t, v) - 4.0) <= 0.08", "report": "v at t=20 (F point)"}, {"id": "c1-n-point-velocity", "why": "F3 · N点速度为-2 m/s", "case": "c1", "expr": "abs(v[-1] - (-2.0)
