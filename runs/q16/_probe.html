<figcaption>取 qE = 1、m = 1、长度单位 d₁ = √(kq/E) 作无量纲化，图中一切读数（力、速度、加速度、间距）都是无量纲值，不是牛顿或米每秒。解出的自洽参数：弹簧原长 L_s = 0.6，劲度 k_s = 30，细杆长 L_r = 0.4，初始间距 d₀ = 1.3，v₁ = √0.15 ≈ 0.387。A 的速度在 d = d₁ = 1 处取极小（即 v₁，B 恰好起动），在 d = 0.5 处取极大（此时弹力恰为 3qE）；细杆与 B 相碰时 v_A = 2v₁、v_B = v₁。</figcaption></figure>


<script>window.Scenes = {};</script>
<script>/* q16 · 匀强电场中两带电滑块的相互作用
 *
 * 无量纲化（与 spec 一致）：qE = 1，m = 1，长度单位 d1 = sqrt(kq/E)。
 * 自由参数 L_s / k_s / L_r / d0 / 初速度由 solve.py 解出（推导见 NOTES.md）：
 *   k_s = 30，L_s = 0.5 + 3/k_s = 0.6，L_r = 0.4，d0 = 1.3
 *   v1 = sqrt(J(L_r)/2) = sqrt(0.15)，J(d) = 积分 g 从 d 到 1
 * 下面 JS 里 v1 与两个初速度都由这些常数现算，轨迹是真的用 RK4 跑出来的。
 */
window.Scenes["q16"] = function (fig) {
  var svg = fig.querySelector('svg');

  /* ================= 物理 ================= */
  var KS = 30.0;   /* 弹簧劲度 k_s */
  var LS = 0.6;    /* 弹簧原长 L_s（k_s(L_s-0.5)=3 由 F2 定） */
  var LR = 0.4;    /* 细杆长 L_r（须大于 g 的第二零点 1/3） */
  var D0 = 1.3;    /* 初始间距 d0 */

  function fSpring(d) { return d < LS ? KS * (LS - d) : 0; }
  function fCoul(d) { return 1 / (d * d); }
  /* a_A = 1 + 1/d^2 - 2 - F_s ；B 起动后 a_B 与之同式 */
  function accel(d) { return fCoul(d) - 1 - fSpring(d); }
  /* J(d) = ∫_d^1 a(x) dx 的闭式，用来定 v1 */
  function Jint(d) {
    var b = 1 / d + d - 2;
    if (d < LS) { b -= 0.5 * KS * (LS - d) * (LS - d); }
    return b;
  }

  var V1 = Math.sqrt(Jint(LR) / 2);          /* F3 给出 J(L_r) = 2 v1^2 */
  var VAPP = 2 * (D0 + 1 / D0 - 2);          /* d>=1 段能量项：v(d0)^2 = v(1)^2 + VAPP */

  /* ---- RK4 时域积分：状态 [d, vA, vB, xA] ---- */
  function deriv(s, moving, out) {
    var a = accel(s[0]);
    out[0] = -(s[1] + s[2]);
    out[1] = a;
    out[2] = moving ? a : 0;
    out[3] = s[1];
    return out;
  }
  function rk4(s, h, moving, out) {
    var k1 = [0, 0, 0, 0], k2 = [0, 0, 0, 0], k3 = [0, 0, 0, 0], k4 = [0, 0, 0, 0];
    var tmp = [0, 0, 0, 0], i;
    deriv(s, moving, k1);
    for (i = 0; i < 4; i++) { tmp[i] = s[i] + 0.5 * h * k1[i]; }
    deriv(tmp, moving, k2);
    for (i = 0; i < 4; i++) { tmp[i] = s[i] + 0.5 * h * k2[i]; }
    deriv(tmp, moving, k3);
    for (i = 0; i < 4; i++) { tmp[i] = s[i] + h * k3[i]; }
    deriv(tmp, moving, k4);
    for (i = 0; i < 4; i++) {
      out[i] = s[i] + (h / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
    }
    return out;
  }

  /* vS = A 经过 S（d = 1）时的速度。d>1 段 B 被静摩擦锁住。 */
  function simulate(vS) {
    var v0 = Math.sqrt(vS * vS + VAPP);
    var dt = 4e-4;
    var s = [D0, v0, 0, 0], ns = [0, 0, 0, 0], tst = [0, 0, 0, 0];
    var T = [0], D = [D0], VA = [v0], VB = [0], XA = [0];
    var t = 0, moving = false, guard = 0, target, h, lo, hi, mid, k;
    while (s[0] > LR && guard < 200000) {
      guard++;
      target = moving ? LR : 1.0;
      h = dt;
      rk4(s, h, moving, ns);
      if (ns[0] <= target) {                    /* 事件：二分收缩步长，精确落到 target */
        lo = 0; hi = h;
        for (k = 0; k < 60; k++) {
          mid = 0.5 * (lo + hi);
          if (rk4(s, mid, moving, tst)[0] > target) { lo = mid; } else { hi = mid; }
        }
        h = hi;
        rk4(s, h, moving, ns);
        ns[0] = target;
      }
      if (!(h > 0)) { break; }
      s[0] = ns[0]; s[1] = ns[1]; s[2] = ns[2]; s[3] = ns[3];
      t += h;
      T.push(t); D.push(s[0]); VA.push(s[1]); VB.push(s[2]); XA.push(s[3]);
      if (!moving && s[0] <= 1.0) { moving = true; }
    }
    return { t: T, d: D, vA: VA, vB: VB, xA: XA, T: t };
  }

  var TR1 = simulate(V1);          /* 情形①：过 S 时 v1 */
  var TR2 = simulate(2 * V1);      /* 情形②：过 S 时 2v1 */

  function traj(cid) { return cid === 'c2' ? TR2 : TR1; }

  /* 按归一化进度 u 取状态（u=0 起点 d0，u=1 细杆碰 B） */
  function stateAt(tr, u) {
    var n = tr.t.length - 1;
    var uu = u < 0 ? 0 : (u > 1 ? 1 : u);
    var tq = uu * tr.T, lo = 0, hi = n, mid, den, w;
    if (!(tq > 0)) { return { t: 0, d: tr.d[0], vA: tr.vA[0], vB: tr.vB[0], xA: tr.xA[0] }; }
    if (tq >= tr.T) { return { t: tr.T, d: tr.d[n], vA: tr.vA[n], vB: tr.vB[n], xA: tr.xA[n] }; }
    while (hi - lo > 1) {
      mid = (lo + hi) >> 1;
      if (tr.t[mid] <= tq) { lo = mid; } else { hi = mid; }
    }
    den = tr.t[hi] - tr.t[lo];
    w = den > 0 ? (tq - tr.t[lo]) / den : 0;
    return {
      t: tq,
      d: tr.d[lo] + w * (tr.d[hi] - tr.d[lo]),
      vA: tr.vA[lo] + w * (tr.vA[hi] - tr.vA[lo]),
      vB: tr.vB[lo] + w * (tr.vB[hi] - tr.vB[lo]),
      xA: tr.xA[lo] + w * (tr.xA[hi] - tr.xA[lo])
    };
  }

  /* d 首次降到 dv 的时刻（用来标出 a=0 的两个时刻，以及位置 S） */
  function atD(tr, dv) {
    var i, w;
    for (i = 1; i < tr.d.length; i++) {
      if (tr.d[i] <= dv) {
        w = (tr.d[i - 1] - tr.d[i]) > 0 ? (tr.d[i - 1] - dv) / (tr.d[i - 1] - tr.d[i]) : 0;
        return { t: tr.t[i - 1] + w * (tr.t[i] - tr.t[i - 1]),
                 xA: tr.xA[i - 1] + w * (tr.xA[i] - tr.xA[i - 1]) };
      }
    }
    return { t: tr.T, xA: tr.xA[tr.xA.length - 1] };
  }

  /* ================= 画布几何 ================= */
  /* X0 = 物理 x=0（A 右端起点）的像素位置，SC = 每单位长度像素，FSC = 每单位力像素。
     力矢量锚在两个滑块的「外侧」边缘：这样 d 最小时（0.4）两个库仑力箭头之间
     仍有 SC*L_r + 2*BW - 2*FSC*(1/L_r^2) = 42 + 60 - 87.5 ≈ 14px 的余量，不会打架。 */
  var X0 = 90, SC = 105, BW = 30, ROD = 138, FSC = 7;
  var PXL = 358, PXW = 186, TAX = 1.6, PYB = 252, PYH = 208, VAX = 1.15;
  function pxT(t) { return PXL + (t / TAX) * PXW; }
  function pxV(v) { return PYB - (v / VAX) * PYH; }

  /* ================= DOM ================= */
  var elCase = svg.querySelector('#q16-caselabel');
  var elBlockA = svg.querySelector('#q16-blockA');
  var elLabA = svg.querySelector('#q16-labA');
  var elLabAq = svg.querySelector('#q16-labAq');
  var elBlockB = svg.querySelector('#q16-blockB');
  var elLabB = svg.querySelector('#q16-labB');
  var elLabBq = svg.querySelector('#q16-labBq');
  var elRod = svg.querySelector('#q16-rod');
  var elSpring = svg.querySelector('#q16-spring');
  var elDarr = svg.querySelector('#q16-darrow');
  var elSline = svg.querySelector('#q16-sline');
  var elSlabel = svg.querySelector('#q16-slabel');
  var elFAs = svg.querySelector('#q16-fAs');
  var elFAf = svg.querySelector('#q16-fAf');
  var elFAc = svg.querySelector('#q16-fAc');
  var elFAe = svg.querySelector('#q16-fAe');
  var elFBs = svg.querySelector('#q16-fBs');
  var elFBf = svg.querySelector('#q16-fBf');
  var elFBc = svg.querySelector('#q16-fBc');
  var elFBe = svg.querySelector('#q16-fBe');
  var elRd = svg.querySelector('#q16-rd');
  var elRfc = svg.querySelector('#q16-rfc');
  var elRfs = svg.querySelector('#q16-rfs');
  var elRaa = svg.querySelector('#q16-raa');
  var elRva = svg.querySelector('#q16-rva');
  var elRvb = svg.querySelector('#q16-rvb');
  var elRratio = svg.querySelector('#q16-rratio');
  var elRt = svg.querySelector('#q16-rt');
  var elCurveA = svg.querySelector('#q16-curveA');
  var elCurveB = svg.querySelector('#q16-curveB');
  var elDotA = svg.querySelector('#q16-dotA');
  var elDotB = svg.querySelector('#q16-dotB');
  var elMk1 = svg.querySelector('#q16-mk1');
  var elMk2 = svg.querySelector('#q16-mk2');
  var elMk1lab = svg.querySelector('#q16-mk1lab');
  var elMk2lab = svg.querySelector('#q16-mk2lab');
  var btn1 = fig.querySelector('#q16-c1');
  var btn2 = fig.querySelector('#q16-c2');

  /* ================= 曲线预采样 ================= */
  var CN = 240;
  function chartOf(tr) {
    var a = [], b = [], i, u, st;
    for (i = 0; i <= CN; i++) {
      u = i / CN;
      st = stateAt(tr, u);
      a.push(pxT(st.t).toFixed(2) + ',' + pxV(st.vA).toFixed(2));
      b.push(pxT(st.t).toFixed(2) + ',' + pxV(st.vB).toFixed(2));
    }

<script>/* ===== 动画运行时 ===== */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var live = [];

  function build(fig) {
    var id = fig.getAttribute('data-scene');
    var factory = window.Scenes[id];
    if (typeof factory !== 'function') return null;
    var api;
    try { api = factory(fig); } catch (e) { console.error('[scene ' + id + '] setup failed', e); return null; }
    if (!api || typeof api.step !== 'function') { console.error('[scene ' + id + '] bad contract'); return null; }

    var bar = document.createElement('div');
    bar.className = 'ctlbar';
    var pp = document.createElement('button');
    pp.type = 'button'; pp.className = 'btn pp';
    var rp = document.createElement('button');
    rp.type = 'button'; rp.className = 'btn'; rp.textContent = '重播';
    var tag = document.createElement('span');
    tag.className = 'livebadge'; tag.textContent = 'LIVE';
    bar.appendChild(pp); bar.appendChild(rp); bar.appendChild(tag);
    var own = fig.querySelector('.ctl');
    if (own) bar.appendChild(own);
    var cap = fig.querySelector('figcaption');
    fig.insertBefore(bar, cap);

    window.__api = window.__api || {}; window.__api[id] = api;
    var s = { id: id, api: api, t: 0, playing: !reduce, visible: true, fig: fig, pp: pp };
    function paint() {
      pp.textContent = s.playing ? '暂停' : '播放';
      pp.setAttribute('aria-pressed', s.playing ? 'true' : 'false');
      pp.setAttribute('aria-label', (s.playing ? '暂停' : '播放') + '动画');
      tag.style.opacity = s.playing ? '.9' : '.3';
    }
    pp.addEventListener('click', function () { s.playing = !s.playing; paint(); });
    rp.addEventListener('click', function () {
      s.t = 0;
      try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] reset', e); }
    });
    paint();
    try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] first frame', e); }

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { s.visible = es[0].isIntersecting; },
        { rootMargin: '120px' }).observe(fig);
    }
    return s;
  }

  function boot() {
    var figs = document.querySelectorAll('figure[data-scene]');
    for (var i = 0; i < figs.length; i++) {
      var s = build(figs[i]);
      if (s) live.push(s);
    }
    var g = document.getElementById('gswitch');
    if (g) {
      g.addEventListener('click', function () {
        var anyOn = live.some(function (s) { return s.playing; });
        live.forEach(function (s) { if (s.playing === anyOn) s.pp.click(); });
        g.textContent = anyOn ? '▶ 全部播放' : '⏸ 全部暂停';
      });
      g.textContent = reduce ? '▶ 全部播放' : '⏸ 全部暂停';

    function frame(now) {

      last = now;

        catch (e) { console.error('[scene ' + s.id + '] step', e); s.playing = false; }

    }

  }

  else boot();
})();

    if (!fig) { out.errors.push("DOM 里找不到 figure[data-scene=" + SID + "]"); throw 0; }
    var api = (window.__api || {})[SID];
    if (!api) { out.errors.push("运行时未能构造该场景（工厂抛错或契约不符）"); throw 0; }
    ["step","reset","probe"].forEach(function(k){
      if (typeof api[k] !== "function") out.errors.push("api." + k + " 不是函数");
    });
    if (out.errors.length) throw 0;

    var svg = fig.querySelector("svg");

    // --- 渲染压力：跑 451 帧 step()，抓异常与脏数值 ---
    try {
      api.reset(); api.step(0);
      for (var t = 0; t <= 18.0001; t += 0.04) api.step(t);
    } catch (e) { rec("step() 抛异常: " + e); }
    var dom = svg.outerHTML;
    ["NaN","Infinity","undefined","null"].forEach(function(w){
      var n = (dom.match(new RegExp(w, "g")) || []).length;
      if (n) out.errors.push("渲染后 SVG 中出现 " + w + " ×" + n);
    });

    /* --- L3.5 渲染覆盖 ---
       断言只跑 probe，看不见渲染。历史教训：把 translate(cx,cy) rotate(θ)
       误写成 rotate(θ cx cy)，整组元素飞出画布，四层门禁 13/13 全绿放行。
       这里补上：每个带 id 的 SVG 元素，必须在某一采样时刻真的画在 viewBox 内。
       只查「位置」不查「可见性」—— opacity=0 的元素 getBBox 依然有效，
       所以合法隐藏的结论框不会被误伤，而「整组飞出画布」是全时段的，必然被抓。*/
    try {
      api.reset();
      var vb = svg.viewBox.baseVal;
      var els = svg.querySelectorAll("[id]");
      var ids = [], everOK = {}, everDrawn = {}, snaps = [];
      for (var q0 = 0; q0 < els.length; q0++) ids.push(els[q0].getAttribute("id"));
      /* 注意：不能用 el.getCTM() —— 它含 viewBox 缩放，返回的是渲染像素坐标，
         拿去和 viewBox 数值比会把右下方的元素全部误判出界。
         正确做法是经 svg 根的 screenCTM 求逆，换回 viewBox 用户单位。 */
      for (var tq = 0; tq <= 20.0001; tq += 0.5) {
        api.step(tq);
        snaps.push(svg.innerHTML);
        var rootM = svg.getScreenCTM();
        if (!rootM) continue;
        var invM = rootM.inverse();
        for (var q1 = 0; q1 < els.length; q1++) {
          var idq = ids[q1];
          if (everOK[idq]) continue;
          var bb, mm;
          try { bb = els[q1].getBBox(); mm = els[q1].getScreenCTM(); } catch (err0) { continue; }
          if (!mm) continue;
          if (bb.width <= 0 && bb.height <= 0) continue;   /* 退化元素不判位置 */
          everDrawn[idq] = true;
          mm = invM.multiply(mm);                          /* → viewBox 用户单位 */
          var cxq = bb.x + bb.width / 2, cyq = bb.y + bb.height / 2;
          var XQ = mm.a * cxq + mm.c * cyq + mm.e;
          var YQ = mm.b * cxq + mm.d * cyq + mm.f;
          if (XQ >= vb.x - 2 && XQ <= vb.x + vb.width + 2 &&
              YQ >= vb.y - 2 && YQ <= vb.y + vb.height + 2)
            everOK[idq] = true;
        }
      }
      var off = [], dead = [];
      for (var q2 = 0; q2 < ids.length; q2++) {
        if (!everDrawn[ids[q2]]) dead.push(ids[q2]);
        else if (!everOK[ids[q2]]) off.push(ids[q2]);
      }
      if (off.length)
        out.render.push("这些元素在全部 41 个采样时刻都画在 viewBox 之外（画面上看不到）：" + off.join(", "));
      var moved = false;
      for (var q3 = 1; q3 < snaps.length; q3++) if (snaps[q3] !== snaps[0]) { moved = true; break; }
      if (!moved)
        out.render.push("采样了 " + snaps.length + " 个不同时刻，SVG 内容完全没有变化——动画没有动");
      out.notes.push("渲染覆盖：" + ids.length + " 个带 id 元素，" +
                     Object.keys(everOK).length + " 个曾正常出现在画面内" +
                     (dead.length ? "，" + dead.length + " 个全程无几何(" + dead.slice(0, 6).join(",") + ")" : ""));
    } catch (errR) { out.render.push("渲染覆盖检查自身失败: " + errR); }

    // --- probe 采样 ---
    var N = SPEC.sample_points || 401;
    for (var ci = 0; ci < SPEC.cases.length; ci++) {
      var cid = SPEC.cases[ci].id;
      var cols = {}; SPEC.probe_keys.forEach(function(k){ cols[k] = []; });

      // 纯度 + 无副作用
      var before = svg.outerHTML;
      var a1 = api.probe(0.37, cid), a2 = api.probe(0.37, cid);
      if (svg.outerHTML !== before) out.errors.push("[" + cid + "] probe() 修改了 DOM（必须是纯函数）");
      SPEC.probe_keys.forEach(function(k){
        if (!(k in a1)) out.errors.push("[" + cid + "] probe 返回值缺少键 " + k);
        else if (a1[k] !== a2[k]) out.errors.push("[" + cid + "] probe 不纯：同一 u 两次调用 " + k + " 不同（" + a1[k] + " vs " + a2[k] + "）");
      });

      var nbad = 0;
      for (var i = 0; i < N; i++) {
        var u = i / (N - 1);
        var r;
        try { r = api.probe(u, cid); }
        catch (e) { out.errors.push("[" + cid + "] probe(" + u.toFixed(3) + ") 抛异常: " + e); break; }
        for (var ki = 0; ki < SPEC.probe_keys.length; ki++) {
          var k = SPEC.probe_keys[ki], v = r ? r[k] : undefined;
          if (typeof v !== "number" || !isFinite(v)) { nbad++; v = null; }
          cols[k].push(v);
        }
      }
      if (nbad) out.errors.push("[" + cid + "] probe 返回了 " + nbad + " 个非有限数值");
      out.series[cid] = cols;
    }
    out.ok = out.errors.length === 0 && out.render.length === 0;
  } catch (e) { if (e) rec(e); }
  document.getElementById("TESTOUT").textContent = "@@" + JSON.stringify(out) + "@@";
}
/* 必须等运行时 boot 完（它也挂在 DOMContentLoaded 上，且注册在前），
   同时保证 <pre id="TESTOUT"> 已经存在 */
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", __runProbe);
else __runProbe();
</script>
<pre id="TESTOUT"></pre>
