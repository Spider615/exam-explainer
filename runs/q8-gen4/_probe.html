<script>window.Scenes = {};</script>
<script>window.Scenes["q8-gen4"] = function (fig) {
  var svg = fig.querySelector('svg');

  // Constants from spec
  var t_E = 10.0;
  var t_F = 20.0;
  var t_M = 40.0;
  var t_N = 53.0;
  var m = 2.0;
  var total_duration = t_N - t_E; // 43s

  // SVG coordinates mapping
  var x_min = 60;
  var x_max = 520;
  var y_min = 260;
  var y_max = 40;
  var t_scale = (x_max - x_min) / (t_N - t_E); // pixels per second
  var y_scale = (y_min - y_max) / 80.0; // 80m height range

  // DOM elements
  var drone = svg.querySelector('#q8-gen4-drone');
  var time_text = svg.querySelector('#q8-gen4-time');
  var height_text = svg.querySelector('#q8-gen4-height');
  var velocity_text = svg.querySelector('#q8-gen4-velocity');

  // Helper functions matching reference implementation
  function y_of_t(t) {
    if (t <= t_F) {
      return 4.0 * t - 26.0;
    } else if (t <= t_M) {
      var dt = t - t_F;
      return 54.0 + 4.0 * dt - 0.15 * dt * dt;
    } else {
      return -2.0 * t + 140.0;
    }
  }

  function v_of_t(t) {
    if (t <= t_F) {
      return 4.0;
    } else if (t <= t_M) {
      return 4.0 - 0.3 * (t - t_F);
    } else {
      return -2.0;
    }
  }

  // Convert physical t to screen x
  function t_to_x(t) {
    return x_min + (t - t_E) * t_scale;
  }

  // Convert physical y to screen y
  function y_to_y(y) {
    return y_min - y * y_scale;
  }

  return {
    step: function (t) {
      // t is playback time, loop every 10 seconds
      var playback_t = t % 10.0;
      var u = playback_t / 10.0; // normalize to [0,1]

      var physical_t = t_E + u * total_duration;
      var y = y_of_t(physical_t);
      var v = v_of_t(physical_t);

      // Update drone position
      var x = t_to_x(physical_t);
      var y_screen = y_to_y(y);
      drone.setAttribute('transform', 'translate(' + x + ',' + y_screen + ')');

      // Update info panel
      time_text.textContent = 't: ' + physical_t.toFixed(1) + 's';
      height_text.textContent = 'y: ' + y.toFixed(1) + 'm';
      velocity_text.textContent = 'v: ' + v.toFixed(1) + 'm/s';
    },

    reset: function () {
      // Reset to start position
      var x = t_to_x(t_E);
      var y = y_to_y(y_of_t(t_E));
      drone.setAttribute('transform', 'translate(' + x + ',' + y + ')');
      time_text.textContent = 't: ' + t_E.toFixed(1) + 's';
      height_text.textContent = 'y: ' + y_of_t(t_E).toFixed(1) + 'm';
      velocity_text.textContent = 'v: ' + v_of_t(t_E).toFixed(1) + 'm/s';
    },

    probe: function (u, caseId) {
      // caseId is only 'c1' per spec
      var t = t_E + u * total_duration;
      var y = y_of_t(t);
      var v = v_of_t(t);
      var p = m * v;

      // Calculate acceleration using numerical differentiation
      var h = 1e-4;
      var t_minus = t - h;
      var t_plus = t + h;
      if (t_minus < t_E) t_minus = t_E;
      if (t_plus > t_N) t_plus = t_N;

      var a;
      if (t_plus > t_minus) {
        a = (v_of_t(t_plus) - v_of_t(t_minus)) / (t_plus - t_minus);
      } else {
        a = 0.0;
      }

      return {
        "u": u,
        "t": t,
        "y": y,
        "v": v,
        "a": a,
        "p": p
      };
    }
  };
};
</script>
<script>/* ===== 动画运行时 ===== */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var live = [];

  function build(fig) {
    var id = fig.getAttribute('data-scene');
    var factory = window.Scenes[id];
    if (typeof factory !== 'function') return null;
    var api;
    try { api = factory(fig); } catch (e) { console.error('[scene ' + id + '] setup failed', e); return null; }
    if (!api || typeof api.step !== 'function') { console.error('[scene ' + id + '] bad contract'); return null; }

    var bar = document.createElement('div');
    bar.className = 'ctlbar';
    var pp = document.createElement('button');
    pp.type = 'button'; pp.className = 'btn pp';
    var rp = document.createElement('button');
    rp.type = 'button'; rp.className = 'btn'; rp.textContent = '重播';
    var tag = document.createElement('span');
    tag.className = 'livebadge'; tag.textContent = 'LIVE';
    bar.appendChild(pp); bar.appendChild(rp); bar.appendChild(tag);
    var own = fig.querySelector('.ctl');
    if (own) bar.appendChild(own);
    var cap = fig.querySelector('figcaption');
    fig.insertBefore(bar, cap);

    window.__api = window.__api || {}; window.__api[id] = api;
    var s = { id: id, api: api, t: 0, playing: !reduce, visible: true, fig: fig, pp: pp };
    function paint() {
      pp.textContent = s.playing ? '暂停' : '播放';
      pp.setAttribute('aria-pressed', s.playing ? 'true' : 'false');
      pp.setAttribute('aria-label', (s.playing ? '暂停' : '播放') + '动画');
      tag.style.opacity = s.playing ? '.9' : '.3';
    }
    pp.addEventListener('click', function () { s.playing = !s.playing; paint(); });
    rp.addEventListener('click', function () {
      s.t = 0;
      try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] reset', e); }
    });
    paint();
    try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] first frame', e); }

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { s.visible = es[0].isIntersecting; },
        { rootMargin: '120px' }).observe(fig);
    }
    return s;
  }

  function boot() {
    var figs = document.querySelectorAll('figure[data-scene]');
    for (var i = 0; i < figs.length; i++) {
      var s = build(figs[i]);
      if (s) live.push(s);
    }
    var g = document.getElementById('gswitch');
    if (g) {
      g.addEventListener('click', function () {
        var anyOn = live.some(function (s) { return s.playing; });
        live.forEach(function (s) { if (s.playing === anyOn) s.pp.click(); });
        g.textContent = anyOn ? '▶ 全部播放' : '⏸ 全部暂停';
      });
      g.textContent = reduce ? '▶ 全部播放' : '⏸ 全部暂停';
    }
    var last = 0;
    function frame(now) {
      var dt = last ? Math.min((now - last) / 1000, 1 / 30) : 0;
      last = now;
      for (var i = 0; i < live.length; i++) {
        var s = live[i];
        if (!s.playing || !s.visible) continue;
        s.t += dt;
        try { s.api.step(s.t); }
        catch (e) { console.error('[scene ' + s.id + '] step', e); s.playing = false; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

of_t(t):\n        if t <= t_F:\n            return 4.0\n        elif t <= t_M:\n            return 4.0 - 0.3 * (t - t_F)\n        else:\n            return -2.0\n\n    t = t_E + u * (t_N - t_E)\n\n    y = y_of_t(t)\n    v = v_of_t(t)\n    p = m * v\n\n    h = 1e-4\n    t_minus = t - h\n    t_plus = t + h\n    if t_minus < t_E:\n        t_minus = t_E\n    if t_plus > t_N:\n        t_plus = t_N\n\n    if t_plus > t_minus:\n        a = (v_of_t(t_plus) - v_of_t(t_minus)) / (t_plus - t_minus)\n    else:\n        a = 0.0\n\n    return {\n        \"u\": u,\n        \"t\": t,\n        \"y\": y,\n        \"v\": v,\n        \"a\": a,\n        \"p\": p\n    }", "invariants": [{"id": "c1-ef-speed", "why": "F1 · EF段速度恒为4 m/s", "case": "c1", "expr": "abs(mean(v[(t>=10.5) & (t<=19.5)]) - 4.0) <= 0.08", "report": "mean(v) in EF segment"}, {"id": "c1-mn-speed", "why": "F2 · MN段速度恒为2 m/s（向下）", "case": "c1", "expr": "abs(mean(v[(t>=40.5) & (t<=52.5)]) - (-2.0)) <= 0.08", "report": "mean(v) in MN segment"}, {"id": "c1-ef-monotonic", "why": "F1 · EF段为匀速直线运动，高度单调上升", "case": "c1", "expr": "max(diff(y[(t>=10) & (t<=20)])) > 0 and max(abs(diff(v[(t>=10) & (t<=20)]))) <= 0.05", "report": "y increasing and v constant in EF"}, {"id": "c1-fm-monotonic-decrease", "why": "F3 · FM段速度从+4连续单调减小到-2，说明加速度恒为负（失重）", "case": "c1", "expr": "max(diff(v[(t>=20) & (t<=40)])) <= 1e-6", "report": "diff(v) in FM segment (should be <=0)"}, {"id": "c1-fm-acceleration-negative", "why": "F5 · FM段加速度方向向下（失重状态）", "case": "c1", "expr": "max(a[(t>=21) & (t<=39)]) <= -0.05", "report": "max(a) in FM segment interior"}, {"id": "c1-mn-acceleration-zero", "why": "F5 · MN段加速度为0", "case": "c1", "expr": "abs(mean(a[(t>=41) & (t<=52)])) <= 0.1", "report": "mean(a) in MN segment"}, {"id": "c1-f-point-velocity", "why": "F3 · F点速度为+4 m/s", "case": "c1", "expr": "abs(interp(20, t, v) - 4.0) <= 0.08", "report": "v at t=20 (F point)"}, {"id": "c1-n-point-velocity", "why": "F3 · N点速度为-2 m/s", "case": "c1", "expr": "abs(v[-1] - (-2.0)) <= 0.08", "report": "v[-1] (N point)"}, {"id": "c1-momentum-change-fn", "why": "F4 · FN段动量变化大小为12 kg·m/s，非4 kg·m/s", "case": "c1", "expr": "abs(abs(p[-1] - interp(20, t, p)) - 12.0) <= 0.5", "report": "abs(p[-1] - p at F)"}, {"id": "c1-momentum-mass-consistency", "why": "F4 · 动量定义p=mv必须在probe内部自洽，避免p与v各算各的", "case": "c1", "expr": "max(abs(p - 2*v)) <= 1e-6", "report": "max abs(p - m*v)"}], "probe_keys": ["u", "t", "y", "v", "a", "p"], "disclosures": [{"why": "对应F1、F5，判断ABD选项需要这些信息在画面上明确可见", "must_contain": "EF段速度恒为4m/s，FM段加速度为负（失重），MN段加速度为0"}], "sample_points": 401, "probe_key_meaning": {"a": "无人机加速度，单位m/s^2（由v数值微分得到）", "p": "无人机总动量，单位kg·m/s，p = 2*v", "t": "物理时间，单位s", "u": "归一化进度，等于传入的u，对应t从t_E=10线性映射到t_N=53", "v": "无人机速度，单位m/s", "y": "无人机高度，单位m"}, "process_endpoints": "u=0对应E点（t=10s，无人机在EF直线段起点，速度4m/s），u=1对应N点（t=53s，MN直线段终点，速度-2m/s）", "scene_requirements": ["画面显示y-t曲线，标注E、F、M、N四点位置", "EF段与MN段以直线（虚线延长可选）显示，FM段以光滑曲线显示", "显示速度v随时间变化的辅助图或数值", "显示无人机图标沿曲线运动，实时高度与速度数值可见", "标注EF段速度恒为4m/s、MN段速度恒为-2m/s"]};
    out.scenes = Object.keys(window.Scenes || {});
    var fig = document.querySelector('figure[data-scene="' + SID + '"]');
    if (!fig) { out.errors.push("DOM 里找不到 figure[data-scene=" + SID + "]"); throw 0; }
    var api = (window.__api || {})[SID];
    if (!api) { out.errors.push("运行时未能构造该场景（工厂抛错或契约不符）"); throw 0; }
    ["step","reset","probe"].forEach(function(k){
      if (typeof api[k] !== "function") out.errors.push("api." + k + " 不是函数");
    });
    if (out.errors.length) throw 0;

    var svg = fig.querySelector("svg");

    // --- 渲染压力：跑 451 帧 step()，抓异常与脏数值 ---
    try {
      api.reset(); api.step(0);
      for (var t = 0; t <= 18.0001; t += 0.04) api.step(t);
    } catch (e) { rec("step() 抛异常: " + e); }
    var dom = svg.outerHTML;
    ["NaN","Infinity","undefined","null"].forEach(function(w){
      var n = (dom.match(new RegExp(w, "g")) || []).length;
      if (n) out.errors.push("渲染后 SVG 中出现 " + w + " ×" + n);
    });

    /* --- L3.5 渲染覆盖 ---
       断言只跑 probe，看不见渲染。历史教训：把 translate(cx,cy) rotate(θ)
       误写成 rotate(θ cx cy)，整组元素飞出画布，四层门禁 13/13 全绿放行。
       这里补上：每个带 id 的 SVG 元素，必须在某一采样时刻真的画在 viewBox 内。
       只查「位置」不查「可见性」—— opacity=0 的元素 getBBox 依然有效，
       所以合法隐藏的结论框不会被误伤，而「整组飞出画布」是全时段的，必然被抓。*/
    try {
      api.reset();
      var vb = svg.viewBox.baseVal;
      var els = svg.querySelectorAll("[id]");
      var ids = [], everOK = {}, everDrawn = {}, snaps = [];
      for (var q0 = 0; q0 < els.length; q0++) ids.push(els[q0].getAttribute("id"));
      /* 注意：不能用 el.getCTM() —— 它含 viewBox 缩放，返回的是渲染像素坐标，
         拿去和 viewBox 数值比会把右下方的元素全部误判出界。
         正确做法是经 svg 根的 screenCTM 求逆，换回 viewBox 用户单位。 */
      for (var tq = 0; tq <= 20.0001; tq += 0.5) {
        api.step(tq);
        snaps.push(svg.innerHTML);
        var rootM = svg.getScreenCTM();
        if (!rootM) continue;
        var invM = rootM.inverse();
        for (var q1 = 0; q1 < els.length; q1++) {
          var idq = ids[q1];
          if (everOK[idq]) continue;
          var bb, mm;
          try { bb = els[q1].getBBox(); mm = els[q1].getScreenCTM(); } catch (err0) { continue; }
          if (!mm) continue;
          if (bb.width <= 0 && bb.height <= 0) continue;   /* 退化元素不判位置 */
          everDrawn[idq] = true;
          mm = invM.multiply(mm);                          /* → viewBox 用户单位 */
          var cxq = bb.x + bb.width / 2, cyq = bb.y + bb.height / 2;
          var XQ = mm.a * cxq + mm.c * cyq + mm.e;
          var YQ = mm.b * cxq + mm.d * cyq + mm.f;
          if (XQ >= vb.x - 2 && XQ <= vb.x + vb.width + 2 &&
              YQ >= vb.y - 2 && YQ <= vb.y + vb.height + 2)
            everOK[idq] = true;
        }
      }
      var off = [], dead = [];
      for (var q2 = 0; q2 < ids.length; q2++) {
        if (!everDrawn[ids[q2]]) dead.push(ids[q2]);
        else if (!everOK[ids[q2]]) off.push(ids[q2]);
      }
      if (off.length)
        out.render.push("这些元素在全部 41 个采样时刻都画在 viewBox 之外（画面上看不到）：" + off.join(", "));
      var moved = false;
      for (var q3 = 1; q3 < snaps.length; q3++) if (snaps[q3] !== snaps[0]) { moved = true; break; }
      if (!moved)
        out.render.push("采样了 " + snaps.length + " 个不同时刻，SVG 内容完全没有变化——动画没有动");
      out.notes.push("渲染覆盖：" + ids.length + " 个带 id 元素，" +
                     Object.keys(everOK).length + " 个曾正常出现在画面内" +
                     (dead.length ? "，" + dead.length + " 个全程无几何(" + dead.slice(0, 6).join(",") + ")" : ""));
    } catch (errR) { out.render.push("渲染覆盖检查自身失败: " + errR); }

    // --- probe 采样 ---
    var N = SPEC.sample_points || 401;
    for (var ci = 0; ci < SPEC.cases.length; ci++) {
      var cid = SPEC.cases[ci].id;
      var cols = {}; SPEC.probe_keys.forEach(function(k){ cols[k] = []; });

      // 纯度 + 无副作用
      var before = svg.outerHTML;
      var a1 = api.probe(0.37, cid), a2 = api.probe(0.37, cid);
      if (svg.outerHTML !== before) out.errors.push("[" + cid + "] probe() 修改了 DOM（必须是纯函数）");
      SPEC.probe_keys.forEach(function(k){
        if (!(k in a1)) out.errors.push("[" + cid + "] probe 返回值缺少键 " + k);
        else if (a1[k] !== a2[k]) out.errors.push("[" + cid + "] probe 不纯：同一 u 两次调用 " + k + " 不同（" + a1[k] + " vs " + a2[k] + "）");
      });

      var nbad = 0;
      for (var i = 0; i < N; i++) {
        var u = i / (N - 1);
        var r;
        try { r = api.probe(u, cid); }
        catch (e) { out.errors.push("[" + cid + "] probe(" + u.toFixed(3) + ") 抛异常: " + e); break; }
        for (var ki = 0; ki < SPEC.probe_keys.length; ki++) {
          var k = SPEC.probe_keys[ki], v = r ? r[k] : undefined;
          if (typeof v !== "number" || !isFinite(v)) { nbad++; v = null; }
          cols[k].push(v);
        }
      }
      if (nbad) out.errors.push("[" + cid + "] probe 返回了 " + nbad + " 个非有限数值");
      out.series[cid] = cols;
    }
    out.ok = out.errors.length === 0 && out.render.length === 0;
  } catch (e) { if (e) rec(e); }
  document.getElementById("TESTOUT").textContent = "@@" + JSON.stringify(out) + "@@";
}
