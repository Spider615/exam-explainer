<figcaption>安培力系数k的数值及反解方法说明：题目未给出B、L、R的具体值，实现方按边界条件 v(0)=v、v(t)=2v，对运动方程 m·dv/dt=mg sinθ−k·v_inst 用二分法数值反解得 k≈2.379（对应等效的 B²L²/R，只需满足边界条件，不要求还原真实 B、L、R）。v-t关系为非线性曲线（而非直线），因为安培力随瞬时速度减小而减小、加速度逐渐增大，故不能把位移取作平均速度1.5v乘以t；由动量定理可得安培力冲量 I=mgt sinθ−mv≈4.00，由动能定理可得动能增量ΔEk=1.5mv²=1.5，而重力做功mgsinθ·d大于电阻焦耳热Q，二者之差恰等于ΔEk，体现能量守恒。</figcaption></figure>


<script>window.Scenes = {};</script>
<script>/* q7 · 斜面导轨中导体杆在磁场中减速（实为加速）运动的动量与能量分析
 *
 * 物理内核与 spec.physics.reference 完全一致：
 *   m dv/dt = m g sinθ − k v，k 未知，由边界条件 v(0)=v0、v(t_total)=2v0
 *   用二分法数值反解（显式欧拉 + 中点速度做位移/冲量/焦耳热的梯形积分，
 *   N=2000 步），probe 直接按 u 取最近采样点，不重新做任何插值近似。
 */
window.Scenes["q7"] = function (fig) {
  var svg = fig.querySelector('svg');

  /* ---------------- 物理常量（国际单位制，θ、m、g 为自设值） ---------------- */
  var M = 1.0;
  var G = 10.0;
  var THETA = Math.PI / 6.0;      /* 30° */
  var V0 = 1.0;
  var T_TOTAL = 1.0;
  var TARGET_V = 2.0 * V0;
  var N = 2000;
  var DT = T_TOTAL / N;
  var GS = G * Math.sin(THETA);   /* g sinθ，重力沿斜面分量的加速度 */

  function simulate(k) {
    var v = V0, d = 0.0, impulse = 0.0, Q = 0.0, i, F, aOfv, vNew, vMid;
    var trajV = [v], trajD = [d], trajImp = [impulse], trajQ = [Q];
    for (i = 0; i < N; i++) {
      F = k * v;
      aOfv = GS - F / M;
      vNew = v + aOfv * DT;
      vMid = 0.5 * (v + vNew);
      d += vMid * DT;
      impulse += k * vMid * DT;
      Q += k * vMid * vMid * DT;
      v = vNew;
      trajV.push(v);
      trajD.push(d);
      trajImp.push(impulse);
      trajQ.push(Q);
    }
    return { v: trajV, d: trajD, imp: trajImp, Q: trajQ };
  }

  /* 二分反解 k，使 v(t_total) = 2 v0（与 spec.reference 相同算法） */
  var kLo = 0.0, kHi = 100.0, kMid, traj, vEnd, it;
  for (it = 0; it < 60; it++) {
    kMid = 0.5 * (kLo + kHi);
    traj = simulate(kMid);
    vEnd = traj.v[N];
    if (vEnd > TARGET_V) { kLo = kMid; } else { kHi = kMid; }
  }
  var K = 0.5 * (kLo + kHi);
  var TRAJ = simulate(K);
  var D_END = TRAJ.d[N];

  /* ================= 纯物理内核：只读 TRAJ，不碰 DOM ================= */
  function sampleAt(u) {
    var uu = u;
    if (!(uu >= 0)) { uu = 0; }
    if (uu > 1) { uu = 1; }
    var idx = Math.round(uu * N);
    if (idx < 0) { idx = 0; }
    if (idx > N) { idx = N; }
    var v = TRAJ.v[idx];
    var F = K * v;
    var a = GS - F / M;
    return {
      u: uu, v: v, a: a, F: F,
      d: TRAJ.d[idx], imp: TRAJ.imp[idx], Q: TRAJ.Q[idx],
      Ek: 0.5 * M * v * v
    };
  }

  /* ================= 屏幕几何（斜面局部坐标：x 沿斜面向下为正） ================= */
  var PX0 = 230, PY0 = 265, TH = THETA, CT = Math.cos(TH), ST = Math.sin(TH);
  function rot(lx, ly) { return [PX0 + lx * CT - ly * ST, PY0 + lx * ST + ly * CT]; }

  var SCALE = 80;          /* px / (v0*t0) */
  var RAIL = 15;           /* 半轨距 */
  var FIELD_PAD = 15;      /* 磁场区域比杆的终点再往下画一点，视觉收口 */
  var X_EXIT = -20;
  var X_ENTRY = X_EXIT - D_END * SCALE;
  var X_APPROACH = X_ENTRY - 55;   /* 入场前的引导区（仅用于 step 视觉，不影响 probe） */

  var VSCALE = 22, FSCALE = 7;

  /* ---------------- DOM 引用 ---------------- */
  var elFieldRect = svg.querySelector('#q7-fieldrect');
  var elFieldPat = svg.querySelector('#q7-fieldpat');
  var elRailU = svg.querySelector('#q7-railU');
  var elRailL = svg.querySelector('#q7-railL');
  var elBoundEntry = svg.querySelector('#q7-boundEntry');
  var elBoundExit = svg.querySelector('#q7-boundExit');
  var elRod = svg.querySelector('#q7-rod');
  var elDotM = svg.querySelector('#q7-dotM');
  var elDotN = svg.querySelector('#q7-dotN');
  var elVarrow = svg.querySelector('#q7-varrow');
  var elFarrow = svg.querySelector('#q7-farrow');
  var elLabM = svg.querySelector('#q7-labM');
  var elLabN = svg.querySelector('#q7-labN');
  var elRoU = svg.querySelector('#q7-ro-u');
  var elRoV = svg.querySelector('#q7-ro-v');
  var elRoD = svg.querySelector('#q7-ro-d');
  var elRoA = svg.querySelector('#q7-ro-a');
  var elRoF = svg.querySelector('#q7-ro-F');
  var elRoEk = svg.querySelector('#q7-ro-Ek');
  var elC1Curve = svg.querySelector('#q7-c1-curve');
  var elC1Dot = svg.querySelector('#q7-c1-dot');
  var elC2Curve = svg.querySelector('#q7-c2-curve');
  var elC2Dot = svg.querySelector('#q7-c2-dot');
  var elC2Final = svg.querySelector('#q7-c2-final');
  var elC3CurveW = svg.querySelector('#q7-c3-curveW');
  var elC3CurveQ = svg.querySelector('#q7-c3-curveQ');
  var elC3DotQ = svg.querySelector('#q7-c3-dotQ');
  var elC3DotW = svg.querySelector('#q7-c3-dotW');
  var elCursor = svg.querySelector('#q7-cursor');
  var elKval = svg.querySelector('#q7-kval');

  /* ---------------- 图表坐标（右侧三个小图共用横轴 u∈[0,1]） ---------------- */
  var CX0 = 345, CX1 = 545;
  function chx(u) { return CX0 + u * (CX1 - CX0); }
  var C1_YTOP = 48, C1_YBOT = 110, C1_LO = 1.0, C1_HI = 2.0;
  var C2_YTOP = 128, C2_YBOT = 190, C2_LO = 0.0, C2_HI = 4.4;
  var C3_YTOP = 208, C3_YBOT = 270, C3_LO = 0.0, C3_HI = 9.5;
  function chy(val, ytop, ybot, lo, hi) { return ybot - (val - lo) / (hi - lo) * (ybot - ytop); }

  /* 预采样曲线（与 probe 用同一个 sampleAt，保证画的和算的是同一套物理） */
  var CN = 150, i2, uu2, s2, PT1 = [], PT2 = [], PT3W = [], PT3Q = [];
  for (i2 = 0; i2 <= CN; i2++) {
    uu2 = i2 / CN;
    s2 = sampleAt(uu2);
    PT1.push(chx(uu2).toFixed(2) + ',' + chy(s2.v, C1_YTOP, C1_YBOT, C1_LO, C1_HI).toFixed(2));
    PT2.push(chx(uu2).toFixed(2) + ',' + chy(s2.imp, C2_YTOP, C2_YBOT, C2_LO, C2_HI).toFixed(2));
    PT3W.push(chx(uu2).toFixed(2) + ',' + chy(M * G * Math.sin(THETA) * s2.d, C3_YTOP, C3_YBOT, C3_LO, C3_HI).toFixed(2));
    PT3Q.push(chx(uu2).toFixed(2) + ',' + chy(s2.Q, C3_YTOP, C3_YBOT, C3_LO, C3_HI).toFixed(2));
  }

  /* ---------------- 静态几何（只与 D_END 有关，随 u 不变，设一次即可） ---------------- */
  function setStaticGeometry() {
    var pTop = rot(X_ENTRY - 70, 0);
    /* 斜面楔形（仅装饰，起点略高于导轨顶端即可，不参与物理） */
    var wedge = svg.querySelector('#q7-wedge');
    if (wedge) {
      wedge.setAttribute('points',
        pTop[0].toFixed(1) + ',' + pTop[1].toFixed(1) + ' ' +
        pTop[0].toFixed(1) + ',' + PY0.toFixed(1) + ' ' +
        PX0.toFixed(1) + ',' + PY0.toFixed(1));
    }
    elRailU.setAttribute('x1', (X_ENTRY - 70).toFixed(2));
    elRailU.setAttribute('y1', (-RAIL).toFixed(2));
    elRailU.setAttribute('x2', (X_EXIT + FIELD_PAD).toFixed(2));
    elRailU.setAttribute('y2', (-RAIL).toFixed(2));
    elRailL.setAttribute('x1', (X_ENTRY - 70).toFixed(2));
    elRailL.setAttribute('y1', RAIL.toFixed(2));
    elRailL.setAttribute('x2', (X_EXIT + FIELD_PAD).toFixed(2));
    elRailL.setAttribute('y2', RAIL.toFixed(2));

    elFieldRect.setAttribute('x', X_ENTRY.toFixed(2));
    elFieldRect.setAttribute('y', (-RAIL - 6).toFixed(2));
    elFieldRect.setAttribute('width', (X_EXIT + FIELD_PAD - X_ENTRY).toFixed(2));
    elFieldRect.setAttribute('height', (2 * (RAIL + 6)).toFixed(2));
    elFieldPat.setAttribute('x', X_ENTRY.toFixed(2));
    elFieldPat.setAttribute('y', (-RAIL - 6).toFixed(2));
    elFieldPat.setAttribute('width', (X_EXIT + FIELD_PAD - X_ENTRY).toFixed(2));
    elFieldPat.setAttribute('height', (2 * (RAIL + 6)).toFixed(2));

    elBoundEntry.setAttribute('x1', X_ENTRY.toFixed(2));
    elBoundEntry.setAttribute('x2', X_ENTRY.toFixed(2));
    elBoundEntry.setAttribute('y1', (-RAIL - 6).toFixed(2));
    elBoundEntry.setAttribute('y2', (RAIL + 6).toFixed(2));
    elBoundExit.setAttribute('x1', X_EXIT.toFixed(2));
    elBoundExit.setAttribute('x2', X_EXIT.toFixed(2));
    elBoundExit.setAttribute('y1', (-RAIL - 6).toFixed(2));
    elBoundExit.setAttribute('y2', (RAIL + 6).toFixed(2));

    if (elKval) { elKval.textContent = 'k≈' + K.toFixed(3); }
    if (elC2Final) { elC2Final.textContent = 'impulse(1)=' + TRAJ.imp[N].toFixed(2); }
  }

  /* ---------------- 每帧渲染：rodX 为杆在局部坐标下的 x（引导阶段与物理阶段共用） ---------------- */
  function render(uPhys, rodX) {
    var s = sampleAt(uPhys);
    var rx = (typeof rodX === 'number') ? rodX : (X_ENTRY + s.d * SCALE);

    elRod.setAttribute('x1', rx.toFixed(2));
    elRod.setAttribute('x2', rx.toFixed(2));
    elDotM.setAttribute('cx', rx.toFixed(2));
    elDotN.setAttribute('cx', rx.toFixed(2));
    elVarrow.setAttribute('x1', rx.toFixed(2));
    elVarrow.setAttribute('x2', (rx + s.v * VSCALE).toFixed(2));
    elFarrow.setAttribute('x1', rx.toFixed(2));
    elFarrow.setAttribute('x2', (rx - s.F * FSCALE).toFixed(2));

<script>/* ===== 动画运行时 ===== */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var live = [];

  function build(fig) {
    var id = fig.getAttribute('data-scene');
    var factory = window.Scenes[id];
    if (typeof factory !== 'function') return null;
    var api;
    try { api = factory(fig); } catch (e) { console.error('[scene ' + id + '] setup failed', e); return null; }
    if (!api || typeof api.step !== 'function') { console.error('[scene ' + id + '] bad contract'); return null; }

    var bar = document.createElement('div');
    bar.className = 'ctlbar';
    var pp = document.createElement('button');
    pp.type = 'button'; pp.className = 'btn pp';
    var rp = document.createElement('button');
    rp.type = 'button'; rp.className = 'btn'; rp.textContent = '重播';
    var tag = document.createElement('span');
    tag.className = 'livebadge'; tag.textContent = 'LIVE';
    bar.appendChild(pp); bar.appendChild(rp); bar.appendChild(tag);
    var own = fig.querySelector('.ctl');
    if (own) bar.appendChild(own);
    var cap = fig.querySelector('figcaption');
    fig.insertBefore(bar, cap);

    window.__api = window.__api || {}; window.__api[id] = api;
    var s = { id: id, api: api, t: 0, playing: !reduce, visible: true, fig: fig, pp: pp };
    function paint() {
      pp.textContent = s.playing ? '暂停' : '播放';
      pp.setAttribute('aria-pressed', s.playing ? 'true' : 'false');
      pp.setAttribute('aria-label', (s.playing ? '暂停' : '播放') + '动画');
      tag.style.opacity = s.playing ? '.9' : '.3';
    }
    pp.addEventListener('click', function () { s.playing = !s.playing; paint(); });
    rp.addEventListener('click', function () {
      s.t = 0;
      try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] reset', e); }
    });
    paint();
    try { if (api.reset) api.reset(); api.step(0); } catch (e) { console.error('[scene ' + id + '] first frame', e); }

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { s.visible = es[0].isIntersecting; },
        { rootMargin: '120px' }).observe(fig);
    }
    return s;
  }

  function boot() {
    var figs = document.querySelectorAll('figure[data-scene]');
    for (var i = 0; i < figs.length; i++) {
      var s = build(figs[i]);
      if (s) live.push(s);
    }
    var g = document.getElementById('gswitch');
    if (g) {
      g.addEventListener('click', function () {
        var anyOn = live.some(function (s) { return s.playing; });
        live.forEach(function (s) { if (s.playing === anyOn) s.pp.click(); });
        g.textContent = anyOn ? '▶ 全部播放' : '⏸ 全部暂停';
      });
      g.textContent = reduce ? '▶ 全部播放' : '⏸ 全部暂停';
    }
    var last = 0;
    function frame(now) {
      var dt = last ? Math.min((now - last) / 1000, 1 / 30) : 0;
      last = now;
      for (var i = 0; i < live.length; i++) {
        var s = live[i];
        if (!s.playing || !s.visible) continue;
        s.t += dt;
        try { s.api.step(s.t); }
        catch (e) { console.error('[scene ' + s.id + '] step', e); s.playing = false; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

    /* --- L3.5 渲染覆盖 ---
       断言只跑 probe，看不见渲染。历史教训：把 translate(cx,cy) rotate(θ)
       误写成 rotate(θ cx cy)，整组元素飞出画布，四层门禁 13/13 全绿放行。
       这里补上：每个带 id 的 SVG 元素，必须在某一采样时刻真的画在 viewBox 内。
       只查「位置」不查「可见性」—— opacity=0 的元素 getBBox 依然有效，
       所以合法隐藏的结论框不会被误伤，而「整组飞出画布」是全时段的，必然被抓。*/
    try {
      api.reset();
      var vb = svg.viewBox.baseVal;
      var els = svg.querySelectorAll("[id]");
      var ids = [], everOK = {}, everDrawn = {}, snaps = [];
      for (var q0 = 0; q0 < els.length; q0++) ids.push(els[q0].getAttribute("id"));
      /* 注意：不能用 el.getCTM() —— 它含 viewBox 缩放，返回的是渲染像素坐标，
         拿去和 viewBox 数值比会把右下方的元素全部误判出界。
         正确做法是经 svg 根的 screenCTM 求逆，换回 viewBox 用户单位。 */
      for (var tq = 0; tq <= 20.0001; tq += 0.5) {
        api.step(tq);
        snaps.push(svg.innerHTML);
        var rootM = svg.getScreenCTM();
        if (!rootM) continue;
        var invM = rootM.inverse();
        for (var q1 = 0; q1 < els.length; q1++) {
          var idq = ids[q1];
          if (everOK[idq]) continue;
          var bb, mm;
          try { bb = els[q1].getBBox(); mm = els[q1].getScreenCTM(); } catch (err0) { continue; }
          if (!mm) continue;
          if (bb.width <= 0 && bb.height <= 0) continue;   /* 退化元素不判位置 */
          everDrawn[idq] = true;
          mm = invM.multiply(mm);                          /* → viewBox 用户单位 */
          var cxq = bb.x + bb.width / 2, cyq = bb.y + bb.height / 2;
          var XQ = mm.a * cxq + mm.c * cyq + mm.e;
          var YQ = mm.b * cxq + mm.d * cyq + mm.f;
          if (XQ >= vb.x - 2 && XQ <= vb.x + vb.width + 2 &&
              YQ >= vb.y - 2 && YQ <= vb.y + vb.height + 2)
            everOK[idq] = true;
        }
      }
      var off = [], dead = [];
      for (var q2 = 0; q2 < ids.length; q2++) {
        if (!everDrawn[ids[q2]]) dead.push(ids[q2]);
        else if (!everOK[ids[q2]]) off.push(ids[q2]);
      }
      if (off.length)
        out.render.push("这些元素在全部 41 个采样时刻都画在 viewBox 之外（画面上看不到）：" + off.join(", "));
      var moved = false;
      for (var q3 = 1; q3 < snaps.length; q3++) if (snaps[q3] !== snaps[0]) { moved = true; break; }
      if (!moved)
        out.render.push("采样了 " + snaps.length + " 个不同时刻，SVG 内容完全没有变化——动画没有动");
      out.notes.push("渲染覆盖：" + ids.length + " 个带 id 元素，" +
                     Object.keys(everOK).length + " 个曾正常出现在画面内" +
                     (dead.length ? "，" + dead.length + " 个全程无几何(" + dead.slice(0, 6).join(",") + ")" : ""));
    } catch (errR) { out.render.push("渲染覆盖检查自身失败: " + errR); }

    // --- probe 采样 ---
    var N = SPEC.sample_points || 401;
    for (var ci = 0; ci < SPEC.cases.length; ci++) {
      var cid = SPEC.cases[ci].id;
      var cols = {}; SPEC.probe_keys.forEach(function(k){ cols[k] = []; });

      // 纯度 + 无副作用
      var before = svg.outerHTML;
      var a1 = api.probe(0.37, cid), a2 = api.probe(0.37, cid);
      if (svg.outerHTML !== before) out.errors.push("[" + cid + "] probe() 修改了 DOM（必须是纯函数）");
      SPEC.probe_keys.forEach(function(k){
        if (!(k in a1)) out.errors.push("[" + cid + "] probe 返回值缺少键 " + k);
        else if (a1[k] !== a2[k]) out.errors.push("[" + cid + "] probe 不纯：同一 u 两次调用 " + k + " 不同（" + a1[k] + " vs " + a2[k] + "）");
      });

      var nbad = 0;
      for (var i = 0; i < N; i++) {
        var u = i / (N - 1);
        var r;
        try { r = api.probe(u, cid); }
        catch (e) { out.errors.push("[" + cid + "] probe(" + u.toFixed(3) + ") 抛异常: " + e); break; }
        for (var ki = 0; ki < SPEC.probe_keys.length; ki++) {
          var k = SPEC.probe_keys[ki], v = r ? r[k] : undefined;
          if (typeof v !== "number" || !isFinite(v)) { nbad++; v = null; }
          cols[k].push(v);
        }
      }
      if (nbad) out.errors.push("[" + cid + "] probe 返回了 " + nbad + " 个非有限数值");
      out.series[cid] = cols;
    }
    out.ok = out.errors.length === 0 && out.render.length === 0;
  } catch (e) { if (e) rec(e); }
  document.getElementById("TESTOUT").textContent = "@@" + JSON.stringify(out) + "@@";
}
/* 必须等运行时 boot 完（它也挂在 DOMContentLoaded 上，且注册在前），
   同时保证 <pre id="TESTOUT"> 已经存在 */
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", __runProbe);
else __runProbe();
</script>
<pre id="TESTOUT"></pre>
